    const PILLARS = ['Edukasi', 'Hiburan', 'Promosi', 'Testimoni', 'Behind the Scenes', 'Tips & Trik', 'Inspirasi'];
    
   const FORMATS = [
      'Video Reels',

    const FORMAT_BADGES = {

      'Story': 'bg-amber-100 text-amber-800 border-amber-200',
      'Postingan Foto': 'bg-sky-100 text-sky-800 border-sky-200',

    const HOURS_24 = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
    const MINUTES_60 = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [calendarViewMode, setCalendarViewMode] = useState('spreadsheet');
      const [calendarStatusFilter, setCalendarStatusFilter] = useState('ALL');
      const [toast, setToast] = useState(null);

    // State Multi-Project Isolation (Safe Fallback)
      const [activeProjectId, setActiveProjectId] = useState(() => {
        let saved = 'default-project';
        try {
          saved = localStorage.getItem('sf_active_project_id') || 'default-project';
        } catch (e) {}
        const sf = window.SocialFlow;
        if (sf && sf.Core && sf.Core.context && typeof sf.Core.context.get === 'function') {
          return sf.Core.context.get().projectId || saved;
        }
        return saved;
      });
      // State Daftar Agency / Projects Dinamis
      const [projectsList, setProjectsList] = useState(() => {
        const defaultProjects = [
          { id: 'default-project', name: 'Main Agency (Default)', type: 'Agency' },
          { id: 'agency-a', name: 'Agency A (Fashion Brand)', type: 'Agency' },
          { id: 'agency-b', name: 'Agency B (Beauty & Care)', type: 'Agency' },
          { id: 'agency-c', name: 'Agency C (F&B / Kuliner)', type: 'UMKM' }
        ];
        try {
          const saved = localStorage.getItem('sf_custom_projects');
          return saved ? JSON.parse(saved) : defaultProjects;
        } catch (e) {
          return defaultProjects;
        }
      });

      // State Akun Medsos Terisolasi per Project
      const [projectAccounts, setProjectAccounts] = useState(() => {
        try {
          const saved = localStorage.getItem(`sf_accounts_${activeProjectId}`);
          return saved ? JSON.parse(saved) : {
            instagram: '@chocoovora',
            tiktok: '@chocoovora.style',
            facebook: 'Chocoovora Official',
            youtube: 'Chocoovora TV',
            shopee: 'Chocoovora Store'
          };
        } catch (e) {
          return { instagram: '', tiktok: '', facebook: '', youtube: '', shopee: '' };
        }
      });

      // Modal State untuk Tambah Project & Edit Akun
      const [showNewProjectModal, setShowNewProjectModal] = useState(false);
      const [newProjectForm, setNewProjectForm] = useState({ name: '', type: 'Agency' });
      const [showAccountModal, setShowAccountModal] = useState(false);

      // Sinkronkan akun medsos saat berpindah project
      useEffect(() => {
        try {
          const saved = localStorage.getItem(`sf_accounts_${activeProjectId}`);
          if (saved) {
            setProjectAccounts(JSON.parse(saved));
          } else {
            setProjectAccounts({
              instagram: `@${activeProjectId}_ig`,
              tiktok: `@${activeProjectId}_tt`,
              facebook: `${activeProjectId} Page`,
              youtube: `${activeProjectId} Channel`,
              shopee: `${activeProjectId} Shop`
            });
          }
        } catch (e) {}
      }, [activeProjectId]);

      const handleSaveAccounts = (updatedAccounts) => {
        setProjectAccounts(updatedAccounts);
        localStorage.setItem(`sf_accounts_${activeProjectId}`, JSON.stringify(updatedAccounts));
        setShowAccountModal(false);
      };
      
const handleDeleteProject = (projectIdToDelete, projectName) => {
        if (projectIdToDelete === 'default-project') {
          alert('Default Project tidak dapat dihapus.');
          return;
        }

        const confirmDelete = window.confirm(`Apakah Anda yakin ingin menghapus "${projectName}"? Seluruh konfigurasi akun lokal untuk agency ini akan dibersihkan.`);
        if (!confirmDelete) return;

        const updatedList = projectsList.filter(p => p.id !== projectIdToDelete);
        setProjectsList(updatedList);
        localStorage.setItem('sf_custom_projects', JSON.stringify(updatedList));
        localStorage.removeItem(`sf_accounts_${projectIdToDelete}`);

        if (activeProjectId === projectIdToDelete) {
          setActiveProjectId('default-project');
          localStorage.setItem('sf_active_project_id', 'default-project');
        }
      };
      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjectForm.name.trim()) return;
        const newId = 'proj-' + Date.now();
        const created = {
          id: newId,
          name: newProjectForm.name.trim(),
          type: newProjectForm.type
        };
        const handleDeleteProject = (projectIdToDelete, projectName) => {
        if (projectIdToDelete === 'default-project') {
          alert('Default Project tidak dapat dihapus.');
          return;
        }

        const confirmDelete = window.confirm(`Apakah Anda yakin ingin menghapus "${projectName}"? Seluruh konfigurasi akun lokal untuk agency ini akan dibersihkan.`);
        if (!confirmDelete) return;

        const updatedList = projectsList.filter(p => p.id !== projectIdToDelete);
        setProjectsList(updatedList);
        localStorage.setItem('sf_custom_projects', JSON.stringify(updatedList));
        localStorage.removeItem(`sf_accounts_${projectIdToDelete}`);

        // Jika agency yang dihapus sedang aktif, kembalikan ke default-project
        if (activeProjectId === projectIdToDelete) {
          setActiveProjectId('default-project');
          localStorage.setItem('sf_active_project_id', 'default-project');
        }
      };
        const updatedList = [...projectsList, created];
        setProjectsList(updatedList);
        localStorage.setItem('sf_custom_projects', JSON.stringify(updatedList));
        setActiveProjectId(newId);
        localStorage.setItem('sf_active_project_id', newId);
        setShowNewProjectModal(false);
        setNewProjectForm({ name: '', type: 'Agency' });
      };

      // Deteksi Layar Otomatis (HP vs Web)
      const [deviceMode, setDeviceMode] = useState(() => {
        return window.innerWidth <= 768 ? 'hp' : 'web';
      });

      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth <= 768) {
            setDeviceMode('hp');
          } else {
            setDeviceMode('web');
          }
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Jam Digital 24 Jam WIB
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const formattedClock = useMemo(() => {
        const h = String(currentTime.getHours()).padStart(2, '0');
        const m = String(currentTime.getMinutes()).padStart(2, '0');
        const s = String(currentTime.getSeconds()).padStart(2, '0');
        return `${h}:${m}:${s}`;
      }, [currentTime]);

      const formattedDateHeader = useMemo(() => {
        return currentTime.toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
      }, [currentTime]);

      // TARGET MATRIKS PER PLATFORM
      const [igTargets, setIgTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_ig');
        return saved ? JSON.parse(saved) : { reels: 5, story: 7, foto: 2, grafis: 3 };
      });

      const [ttTargets, setTtTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_tt');
        return saved ? JSON.parse(saved) : { video: 7, story: 5 };
      });

      const [fbTargets, setFbTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_fb');
        return saved ? JSON.parse(saved) : { foto: 3, video: 2, grafis: 2 };
      });

      useEffect(() => {
        localStorage.setItem('sf_matrix_ig', JSON.stringify(igTargets));
      }, [igTargets]);

      useEffect(() => {
        localStorage.setItem('sf_matrix_tt', JSON.stringify(ttTargets));
      }, [ttTargets]);

      useEffect(() => {
        localStorage.setItem('sf_matrix_fb', JSON.stringify(fbTargets));
      }, [fbTargets]);

      const totalIgTarget = useMemo(() => {
        return (Number(igTargets.reels)||0) + (Number(igTargets.story)||0) + (Number(igTargets.foto)||0) + (Number(igTargets.grafis)||0);
      }, [igTargets]);

      const totalTtTarget = useMemo(() => {
        return (Number(ttTargets.video)||0) + (Number(ttTargets.story)||0);
      }, [ttTargets]);

      const totalFbTarget = useMemo(() => {
        return (Number(fbTargets.foto)||0) + (Number(fbTargets.video)||0) + (Number(fbTargets.grafis)||0);
      }, [fbTargets]);

      const grandTotalWeeklyTarget = useMemo(() => {
        return totalIgTarget + totalTtTarget + totalFbTarget;
      }, [totalIgTarget, totalTtTarget, totalFbTarget]);

      // STATE DATA KONTEN & IDE
      const [contents, setContents] = useState(() => {
        const saved = localStorage.getItem('sf_contents');
        return saved ? JSON.parse(saved) : [];
      });

      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('sf_ideas');
        return saved ? JSON.parse(saved) : [];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [filterPlatform, setFilterPlatform] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterFormat, setFilterFormat] = useState('ALL');

      const [showContentModal, setShowContentModal] = useState(false);
      const [editingContent, setEditingContent] = useState(null);

      const [schedHour, setSchedHour] = useState('18');
      const [schedMinute, setSchedMinute] = useState('00');

      const [formData, setFormData] = useState({
        title: '', platform: 'Instagram', format: 'Video Reels', pillar: 'Edukasi', status: 'Ide',
        scheduledDate: new Date().toISOString().split('T')[0],
        caption: '', hashtags: '', referenceUrl: '', assetUrl: '',
        views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
      });

      const [ideaForm, setIdeaForm] = useState({
        title: '', platform: 'TikTok', format: 'Video Reels', pillar: 'Edukasi', description: '', referenceUrl: '', assetUrl: ''
      });

      const showToastMessage = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('sf_contents', JSON.stringify(contents));
      }, [contents]);

      useEffect(() => {
        localStorage.setItem('sf_ideas', JSON.stringify(ideas));
      }, [ideas]);

     // AUTENTIKASI ANONYMOUS, MEMBERSHIP DEFAULT, & SCOPING FIRESTORE
      useEffect(() => {
        const handleProjectSwitch = (payload) => {
          const newId = (payload && payload.projectId) ? payload.projectId : (payload && payload.detail && payload.detail.projectId);
          if (newId) {
            setActiveProjectId(newId);
          }
        };

        const sfCore = window.SocialFlow && window.SocialFlow.Core;
        const hasCoreEvents = sfCore && sfCore.events && typeof sfCore.events.on === 'function';

        if (hasCoreEvents) {
          sfCore.events.on('project:changed', handleProjectSwitch);
        }
        window.addEventListener('project:changed', handleProjectSwitch);

        let unsubscribe = null;

        const initSync = async () => {
          if (!firestoreDb || !window.firebase || !firebase.auth) return;

          try {
            // 1. Pastikan pengguna punya sesi login (Anonymous Auth)
            let currentUser = firebase.auth().currentUser;
            if (!currentUser) {
              const userCred = await firebase.auth().signInAnonymously();
              currentUser = userCred.user;
            }

            // 2. Daftarkan membership pemilik otomatis di database
            if (currentUser && currentUser.uid) {
              const memberDocRef = firestoreDb
                .collection("project_members")
                .doc(`${activeProjectId}_${currentUser.uid}`);
              
              await memberDocRef.set({
                projectId: activeProjectId,
                userId: currentUser.uid,
                role: 'owner',
                updatedAt: new Date().toISOString()
              }, { merge: true }).catch(() => {});
            }

            // 3. Ambil data dengan scoping query
            unsubscribe = firestoreDb.collection("contents")
              .where("projectId", "==", activeProjectId)
              .onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                  const remoteData = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data(),
                    projectId: doc.data().projectId || 'default-project'
                  }));
                  setContents(remoteData);
                } else {
                  setContents([]);
                }
              }, (err) => {
                // Jika izin dibatasi rules, beralih ke penyimpanan lokal tanpa error
                console.info("[SF-INFO] Beralih ke penyimpanan lokal untuk project:", activeProjectId);
                const localSaved = localStorage.getItem('sf_contents');
                if (localSaved) {
                  try {
                    const parsed = JSON.parse(localSaved);
                    setContents(parsed.filter(c => (c.projectId || 'default-project') === activeProjectId));
                  } catch (e) {}
                }
              });

          } catch (authErr) {
            console.info("[SF-INFO] Berjalan dalam mode offline lokal:", authErr.message);
          }
        };

        initSync();

        return () => {
          if (unsubscribe) unsubscribe();
          if (hasCoreEvents && typeof sfCore.events.off === 'function') {
            sfCore.events.off('project:changed', handleProjectSwitch);
          }
          window.removeEventListener('project:changed', handleProjectSwitch);
        };
      }, [activeProjectId]);

      const openContentModal = (contentToEdit = null) => {
        if (contentToEdit) {
          setEditingContent(contentToEdit);
          setFormData(contentToEdit);
          if (contentToEdit.scheduledTime) {
            const parts = contentToEdit.scheduledTime.split(':');
            setSchedHour(parts[0] ? parts[0].padStart(2, '0') : '18');
            setSchedMinute(parts[1] ? parts[1].padStart(2, '0') : '00');
          } else {
            setSchedHour('18');
            setSchedMinute('00');
          }
        } else {
          setEditingContent(null);
          setFormData({
            title: '', platform: 'Instagram', format: 'Video Reels', pillar: 'Edukasi', status: 'Ide',
            scheduledDate: new Date().toISOString().split('T')[0],
            caption: '', hashtags: '', referenceUrl: '', assetUrl: '',
            views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
          });
          setSchedHour('18');
          setSchedMinute('00');
        }
        setShowContentModal(true);
      };

      const handleSaveContent = async (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const final24HourTime = `${schedHour.padStart(2, '0')}:${schedMinute.padStart(2, '0')}`;

        const payload = {
          ...formData,
          projectId: activeProjectId || 'default-project',
          scheduledTime: final24HourTime,
          views: Number(formData.views) || 0,
          reach: Number(formData.reach) || 0,
          likes: Number(formData.likes) || 0,
          comments: Number(formData.comments) || 0,
          shares: Number(formData.shares) || 0,
          saves: Number(formData.saves) || 0,
          updatedAt: new Date().toISOString()
        };

        if (editingContent) {
          const targetId = editingContent.id;
          setContents(prev => prev.map(c => c.id === targetId ? { ...payload, id: targetId } : c));
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(String(targetId)).set(payload, { merge: true }); } catch (err) {}
          }
          showToastMessage("Konten berhasil diperbarui!");
        } else {
          const newId = "cnt-" + Date.now();
          const toAdd = { ...payload, id: newId, createdAt: new Date().toISOString() };
          setContents(prev => [toAdd, ...prev]);
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(newId).set(toAdd); } catch (err) {}
          }
          showToastMessage("Rencana konten baru berhasil dibuat!");
        }
        setShowContentModal(false);
        setEditingContent(null);
      };

      const handleDeleteContent = async (id) => {
        if (!confirm("Hapus jadwal konten ini secara permanen dari database?")) return;
        setContents(prev => prev.filter(c => c.id !== id));
        if (firestoreDb) {
          try { await firestoreDb.collection("contents").doc(String(id)).delete(); } catch (err) {}
        }
        showToastMessage("Konten berhasil dihapus.");
      };

      const handleDuplicateContent = (item) => {
        const dupId = "cnt-" + Date.now();
        const dup = { 
          ...item, 
          id: dupId, 
          projectId: activeProjectId || 'default-project',
          title: item.title + " (Duplikat)", 
          status: "Ide" 
        };
        setContents(prev => [dup, ...prev]);
        if (firestoreDb) {
          try { firestoreDb.collection("contents").doc(dupId).set(dup); } catch (err) {}
        }
        showToastMessage("Konten diduplikasi ke Bank Ide!");
      };

      const handleShiftPendingDays = (days) => {
        const updated = contents.map(c => {
          if (['Ide', 'Brief', 'Produksi', 'Editing', 'Siap Posting', 'Terjadwal'].includes(c.status)) {
            const d = new Date(c.scheduledDate);
            d.setDate(d.getDate() + days);
            const newDateStr = d.toISOString().split('T')[0];
            return { ...c, scheduledDate: newDateStr };
          }
          return c;
        });
        setContents(updated);
        showToastMessage(`Seluruh jadwal belum tayang digeser +${days} hari!`);
      };

      // SHARE AGENDA KONTEN KE WHATSAPP
      const handleShareWhatsAppAgenda = () => {
        if (contents.length === 0) {
          alert("Belum ada agenda konten untuk dibagikan.");
          return;
        }

        const sorted = [...contents].sort((a,b) => new Date(a.scheduledDate) - new Date(b.scheduledDate));
        
        let text = `*EDITORIAL CONTENT AGENDA - BOBY ANGGARA*\n`;
        text += `🎯 Project: ${activeProjectId}\n`;
        text += `📅 Tanggal Rilis: ${new Date().toLocaleDateString('id-ID', { dateStyle: 'long' })}\n`;
        text += `🎯 Total Jadwal Terdata: ${sorted.length} Konten\n`;
        text += `--------------------------------------\n\n`;

        sorted.forEach((item, idx) => {
          text += `*#${idx + 1}. [${item.platform.toUpperCase()}] - ${item.scheduledDate} (${item.scheduledTime} WIB)*\n`;
          text += `📌 *Format:* ${item.format} | *Pilar:* ${item.pillar}\n`;
          text += `📝 *Judul/Hook:* ${item.title}\n`;
          text += `📊 *Status:* ${item.status}\n`;
          if (item.assetUrl) text += `📁 *Aset Materi:* ${item.assetUrl}\n`;
          if (item.referenceUrl) text += `🔗 *Referensi:* ${item.referenceUrl}\n`;
          text += `\n`;
        });

        text += `--------------------------------------\n`;
        text += `Dikirim otomatis melalui SocialFlow Studio Pro`;

        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;

                            type="number"
                            value={formData.reach}
                            onChange={(e) => setFormData({ ...formData, reach: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Likes</label>
                          <input
                            type="number"
                            value={formData.likes}
                            onChange={(e) => setFormData({ ...formData, likes: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowContentModal(false)}
                      className="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 font-semibold hover:bg-slate-50"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md shadow-indigo-600/30 hover:bg-indigo-700"
                    >
                      Simpan Konten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
