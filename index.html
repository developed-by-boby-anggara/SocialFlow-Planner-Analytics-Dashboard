<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialFlow Planner & Analytics Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Umd) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk membaca JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const PLATFORMS = {
      TIKTOK: { name: 'TikTok', bg: 'bg-black text-white' },
      INSTAGRAM: { name: 'Instagram', bg: 'bg-pink-600 text-white' },
      FACEBOOK: { name: 'Facebook', bg: 'bg-blue-600 text-white' }
    };

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [contents, setContents] = useState([
        {
          id: 1,
          title: '5 Tips Optimasi Reels & Algoritma 2026',
          platform: 'Instagram',
          format: 'Reels',
          pillar: 'Edukasi',
          status: 'Published',
          views: 18400,
          reach: 14200,
          likes: 1120,
          comments: 84
        },
        {
          id: 2,
          title: 'POV: Kerja di Agensi pas Hari Jumat Sore',
          platform: 'TikTok',
          format: 'TikTok Video',
          pillar: 'Hiburan',
          status: 'Published',
          views: 65200,
          reach: 49000,
          likes: 5800,
          comments: 420
        },
        {
          id: 3,
          title: 'Promo Flash Sale Payday Akhir Bulan',
          platform: 'Facebook',
          format: 'Carousel',
          pillar: 'Promosi',
          status: 'Siap Posting',
          views: 0,
          reach: 0,
          likes: 0,
          comments: 0
        }
      ]);

      const [showModal, setShowModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newPlatform, setNewPlatform] = useState('Instagram');
      const [newFormat, setNewFormat] = useState('Reels');
      const [newPillar, setNewPillar] = useState('Edukasi');

      const handleAddContent = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        const item = {
          id: Date.now(),
          title: newTitle,
          platform: newPlatform,
          format: newFormat,
          pillar: newPillar,
          status: 'Ide',
          views: 0,
          reach: 0,
          likes: 0,
          comments: 0
        };
        setContents([item, ...contents]);
        setNewTitle('');
        setShowModal(false);
      };

      const totalViews = useMemo(() => contents.reduce((acc, c) => acc + (c.views || 0), 0), [contents]);
      const totalReach = useMemo(() => contents.reduce((acc, c) => acc + (c.reach || 0), 0), [contents]);
      const totalLikes = useMemo(() => contents.reduce((acc, c) => acc + (c.likes || 0), 0), [contents]);
      const avgER = totalReach > 0 ? ((totalLikes / totalReach) * 100).toFixed(2) : 0;

      return (
        <div className="flex min-h-screen">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 text-slate-100 flex flex-col justify-between p-5">
            <div>
              <div className="flex items-center gap-2 mb-8">
                <div className="w-8 h-8 rounded bg-indigo-500 flex items-center justify-center font-bold text-white text-lg">S</div>
                <h1 className="text-lg font-bold tracking-tight">SocialFlow</h1>
              </div>
              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: '📊 Dashboard' },
                  { id: 'planner', label: '📝 Content Planner' },
                  { id: 'database', label: '🗄️ Database Konten' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition ${
                      tab === item.id ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>
            <div className="text-xs text-slate-400 border-t border-slate-800 pt-4">
              <p className="font-semibold text-slate-200">SocialFlow Dashboard</p>
              <p>WIB (Asia/Jakarta)</p>
            </div>
          </aside>

          {/* Main Area */}
          <main className="flex-1 p-8 overflow-y-auto">
            {/* Top Bar */}
            <div className="flex justify-between items-center mb-8">
              <div>
                <h2 className="text-2xl font-bold text-slate-900 capitalize">{tab}</h2>
                <p className="text-sm text-slate-500">Kelola dan pantau kinerja seluruh konten media sosial.</p>
              </div>
              <button
                onClick={() => setShowModal(true)}
                className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg shadow-sm transition"
              >
                + Tambah Rencana Konten
              </button>
            </div>

            {/* KPI Cards */}
            <div className="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Konten</p>
                <p className="text-3xl font-extrabold text-slate-900 mt-2">{contents.length}</p>
                <p className="text-xs text-emerald-600 mt-2">Direncanakan & Tayang</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Views</p>
                <p className="text-3xl font-extrabold text-slate-900 mt-2">{totalViews.toLocaleString('id-ID')}</p>
                <p className="text-xs text-indigo-600 mt-2">Akumulasi tayangan</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Reach</p>
                <p className="text-3xl font-extrabold text-slate-900 mt-2">{totalReach.toLocaleString('id-ID')}</p>
                <p className="text-xs text-purple-600 mt-2">Akun terjangkau</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Avg. Engagement Rate</p>
                <p className="text-3xl font-extrabold text-slate-900 mt-2">{avgER}%</p>
                <p className="text-xs text-slate-500 mt-2">Rasio interaksi / reach</p>
              </div>
            </div>

            {/* Data Table */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 className="font-bold text-slate-800">Daftar Konten Aktif</h3>
                <span className="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">
                  {contents.length} item
                </span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-slate-600">
                  <thead className="bg-slate-50 text-xs text-slate-500 uppercase">
                    <tr>
                      <th className="px-6 py-3">Judul Konten</th>
                      <th className="px-6 py-3">Platform</th>
                      <th className="px-6 py-3">Format</th>
                      <th className="px-6 py-3">Pillar</th>
                      <th className="px-6 py-3">Status</th>
                      <th className="px-6 py-3 text-right">Views</th>
                      <th className="px-6 py-3 text-right">Interaksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {contents.map((item) => (
                      <tr key={item.id} className="hover:bg-slate-50 transition">
                        <td className="px-6 py-4 font-semibold text-slate-800">{item.title}</td>
                        <td className="px-6 py-4">
                          <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${
                            item.platform === 'Instagram' ? 'bg-pink-100 text-pink-700' :
                            item.platform === 'TikTok' ? 'bg-slate-900 text-white' : 'bg-blue-100 text-blue-700'
                          }`}>
                            {item.platform}
                          </span>
                        </td>
                        <td className="px-6 py-4">{item.format}</td>
                        <td className="px-6 py-4">{item.pillar}</td>
                        <td className="px-6 py-4">
                          <span className="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">
                            {item.status}
                          </span>
                        </td>
                        <td className="px-6 py-4 text-right font-medium text-slate-700">{item.views.toLocaleString('id-ID')}</td>
                        <td className="px-6 py-4 text-right font-medium text-slate-700">{(item.likes + item.comments).toLocaleString('id-ID')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Modal Tambah Konten */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
                <h3 className="text-lg font-bold text-slate-900 mb-4">Tambah Rencana Konten</h3>
                <form onSubmit={handleAddContent} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Judul / Ide Konten</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: 3 Kombinasi Warna Outfit Musim Panas"
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Platform</label>
                      <select
                        value={newPlatform}
                        onChange={(e) => setNewPlatform(e.target.value)}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="Instagram">Instagram</option>
                        <option value="TikTok">TikTok</option>
                        <option value="Facebook">Facebook</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">Format</label>
                      <select
                        value={newFormat}
                        onChange={(e) => setNewFormat(e.target.value)}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                      >
                        <option value="Reels">Reels / Video</option>
                        <option value="Carousel">Carousel</option>
                        <option value="Foto">Foto / Feed</option>
                        <option value="Story">Story</option>
                        <option value="Live">Live</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Pillar Konten</label>
                    <select
                      value={newPillar}
                      onChange={(e) => setNewPillar(e.target.value)}
                      className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                      <option value="Edukasi">Edukasi</option>
                      <option value="Hiburan">Hiburan</option>
                      <option value="Promosi">Promosi</option>
                      <option value="Behind the Scenes">Behind the Scenes</option>
                      <option value="Testimoni">Testimoni</option>
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-4">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm"
                    >
                      Simpan Konten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
