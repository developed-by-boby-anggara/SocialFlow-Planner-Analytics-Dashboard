<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boby Anggara Dashboard - SocialFlow Planner (V2.5.1 PRO)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone untuk membaca JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore SDK -->
 <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Modules SocialFlow V3 -->
<script src="modules/core.js"></script>
<script src="modules/workspace-manager.js"></script>
<script src="modules/project-switcher-ui.js"></script>
<script src="modules/social-account-manager.js"></script>
<script src="modules/content-ai.js"></script>
<script src="modules/content-ai-studio-ui.js"></script>
<script src="modules/production-workflow.js"></script>
  
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INISIALISASI FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyCEJGbd7A3SqqzvyiY1aP9sqeeHKnzyfqI",
      authDomain: "socialflow-planner-analytics.firebaseapp.com",
      projectId: "socialflow-planner-analytics",
      storageBucket: "socialflow-planner-analytics.firebasestorage.app",
      messagingSenderId: "41368071647",
      appId: "1:41368071647:web:878b7ada81d622cb64286a"
    };

    let firestoreDb = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      firestoreDb = firebase.firestore();
    } catch (err) {
      console.warn("Firestore fallback:", err);
    }

    // --- IDENTITAS VISUAL PLATFORM ---
    const PLATFORMS = {
      TIKTOK: { 
        name: 'TikTok', 
        bg: 'bg-black text-white', 
        badge: 'bg-black text-white border-slate-900',
        border: 'border-slate-800',
        ring: 'focus:ring-black'
      },
      INSTAGRAM: { 
        name: 'Instagram', 
        bg: 'bg-gradient-to-r from-purple-500 via-pink-500 to-rose-500 text-white', 
        badge: 'bg-gradient-to-r from-purple-500 to-pink-500 text-white border-pink-500',
        border: 'border-pink-300',
        ring: 'focus:ring-pink-500'
      },
      FACEBOOK: { 
        name: 'Facebook', 
        bg: 'bg-blue-600 text-white', 
        badge: 'bg-blue-600 text-white border-blue-600',
        border: 'border-blue-300',
        ring: 'focus:ring-blue-600'
      }
    };

    const STATUS_LIST = ['Ide', 'Brief', 'Produksi', 'Editing', 'Siap Posting', 'Terjadwal', 'Published', 'Cancelled'];
    const PILLARS = ['Edukasi', 'Hiburan', 'Promosi', 'Testimoni', 'Behind the Scenes', 'Tips & Trik', 'Inspirasi'];
    
    const FORMATS = [
      'Video Reels',
      'Story',
      'Postingan Foto',
      'Desain Grafis',
      'Carousel',
      'TikTok Video',
      'Facebook Video',
      'Live Streaming'
    ];

    const FORMAT_BADGES = {
      'Video Reels': 'bg-rose-100 text-rose-800 border-rose-200',
      'Story': 'bg-amber-100 text-amber-800 border-amber-200',
      'Postingan Foto': 'bg-sky-100 text-sky-800 border-sky-200',
      'Desain Grafis': 'bg-indigo-100 text-indigo-800 border-indigo-200',
      'Carousel': 'bg-purple-100 text-purple-800 border-purple-200',
      'TikTok Video': 'bg-slate-900 text-white border-slate-950',
      'Facebook Video': 'bg-blue-100 text-blue-800 border-blue-200',
      'Live Streaming': 'bg-red-100 text-red-700 border-red-300 font-bold'
    };

    const HOURS_24 = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
    const MINUTES_60 = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [calendarViewMode, setCalendarViewMode] = useState('spreadsheet');
      const [calendarStatusFilter, setCalendarStatusFilter] = useState('ALL');
      const [toast, setToast] = useState(null);

      // Deteksi Layar Otomatis (HP vs Web)
      const [deviceMode, setDeviceMode] = useState(() => {
        return window.innerWidth <= 768 ? 'hp' : 'web';
      });

      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth <= 768) {
            setDeviceMode('hp');
          } else {
            setDeviceMode('web');
          }
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Jam Digital 24 Jam WIB
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const formattedClock = useMemo(() => {
        const h = String(currentTime.getHours()).padStart(2, '0');
        const m = String(currentTime.getMinutes()).padStart(2, '0');
        const s = String(currentTime.getSeconds()).padStart(2, '0');
        return `${h}:${m}:${s}`;
      }, [currentTime]);

      const formattedDateHeader = useMemo(() => {
        return currentTime.toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
      }, [currentTime]);

      // TARGET MATRIKS PER PLATFORM
      const [igTargets, setIgTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_ig');
        return saved ? JSON.parse(saved) : { reels: 5, story: 7, foto: 2, grafis: 3 };
      });

      const [ttTargets, setTtTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_tt');
        return saved ? JSON.parse(saved) : { video: 7, story: 5 };
      });

      const [fbTargets, setFbTargets] = useState(() => {
        const saved = localStorage.getItem('sf_matrix_fb');
        return saved ? JSON.parse(saved) : { foto: 3, video: 2, grafis: 2 };
      });

      useEffect(() => {
        localStorage.setItem('sf_matrix_ig', JSON.stringify(igTargets));
      }, [igTargets]);

      useEffect(() => {
        localStorage.setItem('sf_matrix_tt', JSON.stringify(ttTargets));
      }, [ttTargets]);

      useEffect(() => {
        localStorage.setItem('sf_matrix_fb', JSON.stringify(fbTargets));
      }, [fbTargets]);

      const totalIgTarget = useMemo(() => {
        return (Number(igTargets.reels)||0) + (Number(igTargets.story)||0) + (Number(igTargets.foto)||0) + (Number(igTargets.grafis)||0);
      }, [igTargets]);

      const totalTtTarget = useMemo(() => {
        return (Number(ttTargets.video)||0) + (Number(ttTargets.story)||0);
      }, [ttTargets]);

      const totalFbTarget = useMemo(() => {
        return (Number(fbTargets.foto)||0) + (Number(fbTargets.video)||0) + (Number(fbTargets.grafis)||0);
      }, [fbTargets]);

      const grandTotalWeeklyTarget = useMemo(() => {
        return totalIgTarget + totalTtTarget + totalFbTarget;
      }, [totalIgTarget, totalTtTarget, totalFbTarget]);

      // STATE DATA KONTEN & IDE
      const [contents, setContents] = useState(() => {
        const saved = localStorage.getItem('sf_contents');
        return saved ? JSON.parse(saved) : [];
      });

      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('sf_ideas');
        return saved ? JSON.parse(saved) : [];
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [filterPlatform, setFilterPlatform] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterFormat, setFilterFormat] = useState('ALL');

      const [showContentModal, setShowContentModal] = useState(false);
      const [editingContent, setEditingContent] = useState(null);

      const [schedHour, setSchedHour] = useState('18');
      const [schedMinute, setSchedMinute] = useState('00');

      const [formData, setFormData] = useState({
        title: '', platform: 'Instagram', format: 'Video Reels', pillar: 'Edukasi', status: 'Ide',
        scheduledDate: new Date().toISOString().split('T')[0],
        caption: '', hashtags: '', referenceUrl: '', assetUrl: '',
        views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
      });

      const [ideaForm, setIdeaForm] = useState({
        title: '', platform: 'TikTok', format: 'Video Reels', pillar: 'Edukasi', description: '', referenceUrl: '', assetUrl: ''
      });

      const showToastMessage = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        localStorage.setItem('sf_contents', JSON.stringify(contents));
      }, [contents]);

      useEffect(() => {
        localStorage.setItem('sf_ideas', JSON.stringify(ideas));
      }, [ideas]);

      useEffect(() => {
        if (!firestoreDb) return;
        const unsubscribe = firestoreDb.collection("contents").onSnapshot((snapshot) => {
          if (!snapshot.empty) {
            const remoteData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setContents(remoteData);
          }
        }, (err) => console.warn("Firestore sync:", err));
        return () => unsubscribe();
      }, []);

      const openContentModal = (contentToEdit = null) => {
        if (contentToEdit) {
          setEditingContent(contentToEdit);
          setFormData(contentToEdit);
          if (contentToEdit.scheduledTime) {
            const parts = contentToEdit.scheduledTime.split(':');
            setSchedHour(parts[0] ? parts[0].padStart(2, '0') : '18');
            setSchedMinute(parts[1] ? parts[1].padStart(2, '0') : '00');
          } else {
            setSchedHour('18');
            setSchedMinute('00');
          }
        } else {
          setEditingContent(null);
          setFormData({
            title: '', platform: 'Instagram', format: 'Video Reels', pillar: 'Edukasi', status: 'Ide',
            scheduledDate: new Date().toISOString().split('T')[0],
            caption: '', hashtags: '', referenceUrl: '', assetUrl: '',
            views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
          });
          setSchedHour('18');
          setSchedMinute('00');
        }
        setShowContentModal(true);
      };

      const handleSaveContent = async (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const final24HourTime = `${schedHour.padStart(2, '0')}:${schedMinute.padStart(2, '0')}`;

        const payload = {
          ...formData,
          scheduledTime: final24HourTime,
          views: Number(formData.views) || 0,
          reach: Number(formData.reach) || 0,
          likes: Number(formData.likes) || 0,
          comments: Number(formData.comments) || 0,
          shares: Number(formData.shares) || 0,
          saves: Number(formData.saves) || 0,
          updatedAt: new Date().toISOString()
        };

        if (editingContent) {
          const targetId = editingContent.id;
          setContents(prev => prev.map(c => c.id === targetId ? { ...payload, id: targetId } : c));
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(String(targetId)).set(payload, { merge: true }); } catch (err) {}
          }
          showToastMessage("Konten berhasil diperbarui!");
        } else {
          const newId = "cnt-" + Date.now();
          const toAdd = { ...payload, id: newId, createdAt: new Date().toISOString() };
          setContents(prev => [toAdd, ...prev]);
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(newId).set(toAdd); } catch (err) {}
          }
          showToastMessage("Rencana konten baru berhasil dibuat!");
        }
        setShowContentModal(false);
        setEditingContent(null);
      };

      const handleDeleteContent = async (id) => {
        if (!confirm("Hapus jadwal konten ini secara permanen dari database?")) return;
        setContents(prev => prev.filter(c => c.id !== id));
        if (firestoreDb) {
          try { await firestoreDb.collection("contents").doc(String(id)).delete(); } catch (err) {}
        }
        showToastMessage("Konten berhasil dihapus.");
      };

      const handleDuplicateContent = (item) => {
        const dupId = "cnt-" + Date.now();
        const dup = { ...item, id: dupId, title: item.title + " (Duplikat)", status: "Ide" };
        setContents(prev => [dup, ...prev]);
        if (firestoreDb) {
          try { firestoreDb.collection("contents").doc(dupId).set(dup); } catch (err) {}
        }
        showToastMessage("Konten diduplikasi ke Bank Ide!");
      };

      const handleShiftPendingDays = (days) => {
        const updated = contents.map(c => {
          if (['Ide', 'Brief', 'Produksi', 'Editing', 'Siap Posting', 'Terjadwal'].includes(c.status)) {
            const d = new Date(c.scheduledDate);
            d.setDate(d.getDate() + days);
            const newDateStr = d.toISOString().split('T')[0];
            return { ...c, scheduledDate: newDateStr };
          }
          return c;
        });
        setContents(updated);
        showToastMessage(`Seluruh jadwal belum tayang digeser +${days} hari!`);
      };

      // FITUR BARU: SHARE AGENDA KONTEN KE WHATSAPP SECARA PROFESIONAL
      const handleShareWhatsAppAgenda = () => {
        if (contents.length === 0) {
          alert("Belum ada agenda konten untuk dibagikan.");
          return;
        }

        const sorted = [...contents].sort((a,b) => new Date(a.scheduledDate) - new Date(b.scheduledDate));
        
        let text = `*EDITORIAL CONTENT AGENDA - BOBY ANGGARA*\n`;
        text += `📅 Tanggal Rilis: ${new Date().toLocaleDateString('id-ID', { dateStyle: 'long' })}\n`;
        text += `🎯 Total Jadwal Terdata: ${sorted.length} Konten\n`;
        text += `--------------------------------------\n\n`;

        sorted.forEach((item, idx) => {
          text += `*#${idx + 1}. [${item.platform.toUpperCase()}] - ${item.scheduledDate} (${item.scheduledTime} WIB)*\n`;
          text += `📌 *Format:* ${item.format} | *Pilar:* ${item.pillar}\n`;
          text += `📝 *Judul/Hook:* ${item.title}\n`;
          text += `📊 *Status:* ${item.status}\n`;
          if (item.assetUrl) text += `📁 *Aset Materi:* ${item.assetUrl}\n`;
          if (item.referenceUrl) text += `🔗 *Referensi:* ${item.referenceUrl}\n`;
          text += `\n`;
        });

        text += `--------------------------------------\n`;
        text += `Dikirim otomatis melalui SocialFlow Studio Pro`;

        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
      };

      const handleSaveIdea = (e) => {
        e.preventDefault();
        if (!ideaForm.title.trim()) return;
        const newIdea = { ...ideaForm, id: "idea-" + Date.now(), status: "Dipertimbangkan" };
        setIdeas([newIdea, ...ideas]);
        setIdeaForm({ title: '', platform: 'TikTok', format: 'Video Reels', pillar: 'Edukasi', description: '', referenceUrl: '', assetUrl: '' });
        showToastMessage("Ide tersimpan di Bank Ide!");
      };

      const handlePromoteIdea = (idea) => {
        setEditingContent(null);
        setFormData({
          title: idea.title,
          platform: idea.platform,
          format: idea.format || 'Video Reels',
          pillar: idea.pillar,
          status: 'Brief',
          scheduledDate: new Date().toISOString().split('T')[0],
          caption: idea.description || '',
          hashtags: '',
          referenceUrl: idea.referenceUrl || '',
          assetUrl: idea.assetUrl || '',
          views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
        });
        setSchedHour('18');
        setSchedMinute('00');
        setShowContentModal(true);
      };

      const handleDeleteIdea = (id) => {
        setIdeas(prev => prev.filter(i => i.id !== id));
        showToastMessage("Ide dihapus.");
      };

      // METRIK SUMMARY
      const metrics = useMemo(() => {
        const total = contents.length;
        const published = contents.filter(c => c.status === 'Published').length;
        const inProgress = contents.filter(c => ['Brief', 'Produksi', 'Editing'].includes(c.status)).length;
        const ready = contents.filter(c => ['Siap Posting', 'Terjadwal'].includes(c.status)).length;
        const ideCount = contents.filter(c => c.status === 'Ide').length;

        const totalViews = contents.reduce((acc, c) => acc + (Number(c.views) || 0), 0);
        const totalReach = contents.reduce((acc, c) => acc + (Number(c.reach) || 0), 0);
        const totalLikes = contents.reduce((acc, c) => acc + (Number(c.likes) || 0), 0);
        const totalComments = contents.reduce((acc, c) => acc + (Number(c.comments) || 0), 0);
        const totalShares = contents.reduce((acc, c) => acc + (Number(c.shares) || 0), 0);
        const totalSaves = contents.reduce((acc, c) => acc + (Number(c.saves) || 0), 0);
        const totalEngagement = totalLikes + totalComments + totalShares + totalSaves;
        const avgER = totalReach > 0 ? ((totalEngagement / totalReach) * 100).toFixed(2) : "0.00";

        // INSTAGRAM
        const igReels = contents.filter(c => c.platform === 'Instagram' && c.format === 'Video Reels').length;
        const igStory = contents.filter(c => c.platform === 'Instagram' && c.format === 'Story').length;
        const igFoto = contents.filter(c => c.platform === 'Instagram' && c.format === 'Postingan Foto').length;
        const igGrafis = contents.filter(c => c.platform === 'Instagram' && ['Desain Grafis', 'Carousel'].includes(c.format)).length;
        const igTotal = contents.filter(c => c.platform === 'Instagram').length;

        // TIKTOK
        const ttVideo = contents.filter(c => c.platform === 'TikTok' && ['TikTok Video', 'Video Reels'].includes(c.format)).length;
        const ttStory = contents.filter(c => c.platform === 'TikTok' && c.format === 'Story').length;
        const ttTotal = contents.filter(c => c.platform === 'TikTok').length;

        // FACEBOOK
        const fbFoto = contents.filter(c => c.platform === 'Facebook' && c.format === 'Postingan Foto').length;
        const fbVideo = contents.filter(c => c.platform === 'Facebook' && ['Facebook Video', 'Video Reels'].includes(c.format)).length;
        const fbGrafis = contents.filter(c => c.platform === 'Facebook' && ['Desain Grafis', 'Carousel'].includes(c.format)).length;
        const fbTotal = contents.filter(c => c.platform === 'Facebook').length;

        const viewsTikTok = contents.filter(c => c.platform === 'TikTok').reduce((acc, c) => acc + (Number(c.views) || 0), 0);
        const viewsInstagram = contents.filter(c => c.platform === 'Instagram').reduce((acc, c) => acc + (Number(c.views) || 0), 0);
        const viewsFacebook = contents.filter(c => c.platform === 'Facebook').reduce((acc, c) => acc + (Number(c.views) || 0), 0);

        const weeklyProgress = grandTotalWeeklyTarget > 0 ? Math.min(Math.round((total / grandTotalWeeklyTarget) * 100), 100) : 0;

        return {
          total, published, inProgress, ready, ideCount,
          totalViews, totalReach, totalEngagement, avgER, weeklyProgress,
          igReels, igStory, igFoto, igGrafis, igTotal,
          ttVideo, ttStory, ttTotal,
          fbFoto, fbVideo, fbGrafis, fbTotal,
          viewsTikTok, viewsInstagram, viewsFacebook
        };
      }, [contents, grandTotalWeeklyTarget]);

      const filteredContents = useMemo(() => {
        return contents.filter(c => {
          const matchSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (c.caption && c.caption.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchPlatform = filterPlatform === 'ALL' || c.platform === filterPlatform;
          const matchStatus = filterStatus === 'ALL' || c.status === filterStatus;
          const matchFormat = filterFormat === 'ALL' || c.format === filterFormat;
          return matchSearch && matchPlatform && matchStatus && matchFormat;
        });
      }, [contents, searchQuery, filterPlatform, filterStatus, filterFormat]);

      const filteredCalendarContents = useMemo(() => {
        if (calendarStatusFilter === 'ALL') return contents;
        return contents.filter(c => c.status === calendarStatusFilter);
      }, [contents, calendarStatusFilter]);

      const handleExportCSV = () => {
        const headers = ["ID", "Judul", "Platform", "Format", "Pillar", "Status", "Tanggal", "Jam (24 Jam)", "Views", "Reach", "Likes", "Comments", "Shares", "Saves", "Referensi", "Aset"];
        const rows = contents.map(c => [
          c.id, `"${c.title.replace(/"/g, '""')}"`, c.platform, c.format, c.pillar, c.status,
          c.scheduledDate, `"${c.scheduledTime} WIB"`, c.views, c.reach, c.likes, c.comments, c.shares, c.saves,
          `"${c.referenceUrl || ''}"`, `"${c.assetUrl || ''}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `BobyAnggara_Dashboard_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToastMessage("Data CSV berhasil didownload!");
      };

      // Komponen Donut Chart SVG
      const renderDonutChart = () => {
        const total = metrics.total || 1;
        const pPublished = (metrics.published / total) * 100;
        const pReady = (metrics.ready / total) * 100;
        const pProgress = (metrics.inProgress / total) * 100;
        const pIde = (metrics.ideCount / total) * 100;

        const stroke1 = (pPublished / 100) * 251.2;
        const stroke2 = (pReady / 100) * 251.2;
        const stroke3 = (pProgress / 100) * 251.2;
        const stroke4 = (pIde / 100) * 251.2;

        const offset1 = 0;
        const offset2 = -stroke1;
        const offset3 = -(stroke1 + stroke2);
        const offset4 = -(stroke1 + stroke2 + stroke3);

        return (
          <div className="flex flex-col sm:flex-row items-center gap-6 justify-around">
            <div className="relative w-36 h-36 flex items-center justify-center">
              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="#f1f5f9" strokeWidth="16" fill="transparent" />
                {metrics.total > 0 ? (
                  <>
                    <circle cx="50" cy="50" r="40" stroke="#10b981" strokeWidth="16" fill="transparent" strokeDasharray={`${stroke1} 251.2`} strokeDashoffset={offset1} />
                    <circle cx="50" cy="50" r="40" stroke="#3b82f6" strokeWidth="16" fill="transparent" strokeDasharray={`${stroke2} 251.2`} strokeDashoffset={offset2} />
                    <circle cx="50" cy="50" r="40" stroke="#f59e0b" strokeWidth="16" fill="transparent" strokeDasharray={`${stroke3} 251.2`} strokeDashoffset={offset3} />
                    <circle cx="50" cy="50" r="40" stroke="#94a3b8" strokeWidth="16" fill="transparent" strokeDasharray={`${stroke4} 251.2`} strokeDashoffset={offset4} />
                  </>
                ) : (
                  <circle cx="50" cy="50" r="40" stroke="#e2e8f0" strokeWidth="16" fill="transparent" />
                )}
              </svg>
              <div className="absolute text-center">
                <span className="text-xl font-black text-slate-800 block leading-tight">{metrics.total}</span>

                          className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition"
                        >
                          12:00 Siang
                        </button>
                        <button
                          type="button"
                          onClick={() => { setSchedHour('17'); setSchedMinute('00'); }}
                          className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition"
                        >
                          17:00 Sore
                        </button>
                        <button
                          type="button"
                          onClick={() => { setSchedHour('19'); setSchedMinute('00'); }}
                          className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition"
                        >
                          19:00 Malam
                        </button>
                        <button
                          type="button"
                          onClick={() => { setSchedHour('21'); setSchedMinute('00'); }}
                          className="text-[9px] font-bold px-2 py-0.5 rounded-md bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition"
                        >
                          21:00 Malam
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Link Referensi</label>
                      <input
                        type="url"
                        placeholder="https://..."
                        value={formData.referenceUrl}
                        onChange={(e) => setFormData({ ...formData, referenceUrl: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Link File / Aset Desain</label>
                      <input
                        type="url"
                        placeholder="Google Drive link..."
                        value={formData.assetUrl}
                        onChange={(e) => setFormData({ ...formData, assetUrl: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Caption</label>
                    <textarea
                      rows="2"
                      placeholder="Tulis caption dan call-to-action..."
                      value={formData.caption}
                      onChange={(e) => setFormData({ ...formData, caption: e.target.value })}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                    ></textarea>
                  </div>

                  {formData.status === 'Published' && (
                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                      <span className="font-bold text-slate-800 text-[11px] block">Pencatatan Metrik Performa:</span>
                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Views</label>
                          <input
                            type="number"
                            value={formData.views}
                            onChange={(e) => setFormData({ ...formData, views: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Reach</label>
                          <input
                            type="number"
                            value={formData.reach}
                            onChange={(e) => setFormData({ ...formData, reach: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Likes</label>
                          <input
                            type="number"
                            value={formData.likes}
                            onChange={(e) => setFormData({ ...formData, likes: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowContentModal(false)}
                      className="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 font-semibold hover:bg-slate-50"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md shadow-indigo-600/30 hover:bg-indigo-700"
                    >
                      Simpan Konten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
