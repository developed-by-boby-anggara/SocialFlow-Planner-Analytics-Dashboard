    const formatWIB = (dateStr, options = {}) => {
      if (!dateStr) return '-';
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '-';
        return new Intl.DateTimeFormat('id-ID', { timeZone: 'Asia/Jakarta', ...options }).format(d);
      } catch (e) {
        return dateStr;
      }
    };

    const calcER = (likes = 0, comments = 0, shares = 0, saves = 0, reach = 0) => {
      if (!reach || Number(reach) <= 0) return 0;
      const total = Number(likes || 0) + Number(comments || 0) + Number(shares || 0) + Number(saves || 0);
      return Number(((total / Number(reach)) * 100).toFixed(2));

    function App() {

      // Data Persistence State
      const [contents, setContents] = React.useState(() => {

      // Simpan perubahan ke LocalStorage otomatis
      React.useEffect(() => {

      }, [contents]);

      React.useEffect(() => {
        localStorage.setItem('socialflow_ideas_v2', JSON.stringify(ideas));
      }, [ideas]);

      // Toast Notifications
      const [toast, setToast] = React.useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);

      // Modals
      const [isModalOpen, setIsModalOpen] = React.useState(false);
      const [editingItem, setEditingItem] = React.useState(null);
      const [viewingItem, setViewingItem] = React.useState(null);
      const [metricModalItem, setMetricModalItem] = React.useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = React.useState(null);

      // Filters
      const [periodFilter, setPeriodFilter] = React.useState('all');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [filterPlatform, setFilterPlatform] = React.useState('all');
      const [filterStatus, setFilterStatus] = React.useState('all');
      const [filterPillar, setFilterPillar] = React.useState('all');

      // Filtered Content
      const filteredContents = React.useMemo(() => {
        const now = new Date();
        return contents.filter(item => {
          if (filterPlatform !== 'all' && !item.platforms.includes(filterPlatform)) return false;
          if (filterStatus !== 'all' && item.status !== filterStatus) return false;
          if (filterPillar !== 'all' && item.contentPillar !== filterPillar) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchTitle = item.title?.toLowerCase().includes(q);
            const matchAssignee = item.assignee?.toLowerCase().includes(q);
            const matchCampaign = item.campaign?.toLowerCase().includes(q);
            if (!matchTitle && !matchAssignee && !matchCampaign) return false;
          }
          if (periodFilter === 'all') return true;
          const date = new Date(item.scheduledAt);
          if (isNaN(date.getTime())) return true;
          const diffDays = (now - date) / (1000 * 3600 * 24);

          if (periodFilter === 'today') return date.toDateString() === now.toDateString();
          if (periodFilter === '7_days') return diffDays >= -1 && diffDays <= 7;
          if (periodFilter === '30_days') return diffDays >= -5 && diffDays <= 30;
          return true;
        });
      }, [contents, filterPlatform, filterStatus, filterPillar, searchQuery, periodFilter]);

      // Handler Simpan Konten Baru/Edit
      const handleSaveContent = (formData) => {
        // Validasi jadwal bentrok pada platform yang sama
        const collision = contents.find(c => {
          if (formData.id && c.id === formData.id) return false;
          const cTime = new Date(c.scheduledAt).toISOString().slice(0, 13);
          const fTime = new Date(formData.scheduledAt).toISOString().slice(0, 13);
          const samePlatform = c.platforms.some(p => formData.platforms.includes(p));
          return cTime === fTime && samePlatform && c.status !== 'Cancelled';
        });

        if (collision) {
          if (!confirm(`Peringatan: Jam posting bentrok dengan "${collision.title}". Tetap simpan?`)) {
            return;
          }
        }

        if (formData.id) {
          setContents(prev => prev.map(c => c.id === formData.id ? { ...c, ...formData, updatedAt: new Date().toISOString() } : c));
          showToast('Konten berhasil diperbarui!');
        } else {
          const newDoc = {
            ...formData,
            id: 'cnt-' + Date.now(),
            createdAt: new Date().toISOString(),
            platformMetrics: {}
          };
          setContents(prev => [newDoc, ...prev]);
          showToast('Rencana konten baru berhasil ditambahkan!');
        }
        setIsModalOpen(false);
        setEditingItem(null);
      };

        const rows = filteredContents.map(c => {
          let v = 0, r = 0, l = 0, co = 0, s = 0, sa = 0;
          if (c.platformMetrics) {
            Object.values(c.platformMetrics).forEach(m => {
              v += Number(m.views || 0);
              r += Number(m.reach || 0);
              l += Number(m.likes || 0);
              co += Number(m.comments || 0);
              s += Number(m.shares || 0);
              sa += Number(m.saves || 0);
            });
          }
          const eng = l + co + s + sa;
          const er = calcER(l, co, s, sa, r);
          return [
            `"${c.id}"`,
            `"${(c.title || '').replace(/"/g, '""')}"`,
            `"${c.platforms.join(', ')}"`,
            `"${c.format || ''}"`,

            `"${c.status || ''}"`,
            `"${c.assignee || ''}"`,
            `"${formatWIB(c.scheduledAt, { dateStyle: 'short', timeStyle: 'short' })}"`,
            v, r, eng, `"${er}%"`

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows].join('\n');
        const encoded = encodeURI(csvContent);
        const link = document.createElement('a');

    // ==========================================
    // 1. DASHBOARD VIEW COMPONENT
    // ==========================================
    function DashboardView({ contents, filteredContents, periodFilter, setPeriodFilter, onOpenDetail, onOpenEdit, onOpenMetric }) {
      // Perhitungan KPI
      const kpis = React.useMemo(() => {
        let planned = 0, published = 0, inProgress = 0, upcoming = 0;
        let views = 0, reach = 0, likes = 0, comments = 0, shares = 0, saves = 0;

        filteredContents.forEach(c => {
          planned++;
          if (c.status === 'Published') published++;
          else if (['Produksi', 'Editing', 'Siap Posting'].includes(c.status)) inProgress++;
          else if (c.status === 'Terjadwal') upcoming++;

          if (c.platformMetrics) {
            Object.values(c.platformMetrics).forEach(m => {
              views += Number(m.views || 0);
              reach += Number(m.reach || 0);
              likes += Number(m.likes || 0);
              comments += Number(m.comments || 0);
              shares += Number(m.shares || 0);
              saves += Number(m.saves || 0);
            });
          }
        });

        const totalEng = likes + comments + shares + saves;
        const avgEr = calcER(likes, comments, shares, saves, reach);

        return { planned, published, inProgress, upcoming, views, reach, totalEng, avgEr };
      }, [filteredContents]);

      // Distribusi Platform
      const platformDist = React.useMemo(() => {
        const counts = { tiktok: 0, instagram: 0, facebook: 0 };
        filteredContents.forEach(c => {
          c.platforms.forEach(p => { if (counts[p] !== undefined) counts[p]++; });
        });
        const total = counts.tiktok + counts.instagram + counts.facebook || 1;
        return [
          { name: 'TikTok', count: counts.tiktok, pct: Math.round((counts.tiktok / total) * 100), color: '#000000' },
          { name: 'Instagram', count: counts.instagram, pct: Math.round((counts.instagram / total) * 100), color: '#E1306C' },
          { name: 'Facebook', count: counts.facebook, pct: Math.round((counts.facebook / total) * 100), color: '#1877F2' }
        ];
      }, [filteredContents]);

      // Platform Views Comparison
      const platformViews = React.useMemo(() => {
        const res = { tiktok: 0, instagram: 0, facebook: 0 };
        filteredContents.forEach(c => {
          if (c.platformMetrics) {
            Object.entries(c.platformMetrics).forEach(([p, m]) => {
              if (res[p] !== undefined) res[p] += Number(m.views || 0);
            });
          }
        });
        return res;
      }, [filteredContents]);

      return (
        <div className="space-y-6">
          {/* Header Dashboard & Periode Filter */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Executive Dashboard</h2>
              <p className="text-xs text-slate-500">Ringkasan operasional dan analisis performa lintas channel media sosial.</p>
            </div>
            <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-xs self-start">
              <Icon name="calendar" className="w-4 h-4 text-slate-400" />
              <select
                value={periodFilter}
                onChange={(e) => setPeriodFilter(e.target.value)}
                className="text-xs font-semibold text-slate-700 bg-transparent focus:outline-none"
              >
                <option value="all">Semua Waktu</option>
                <option value="today">Hari Ini</option>
                <option value="7_days">7 Hari Terakhir</option>
                <option value="30_days">30 Hari Terakhir</option>
              </select>
            </div>
          </div>

          {/* 8 KARTU KPI UTAMA */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              { label: 'Direncanakan', val: kpis.planned, sub: 'Total konten pipeline', icon: 'table', color: 'text-indigo-600 bg-indigo-50' },
              { label: 'Dipublikasikan', val: kpis.published, sub: 'Sudah tayang', icon: 'check', color: 'text-emerald-600 bg-emerald-50' },
              { label: 'Dalam Proses', val: kpis.inProgress, sub: 'Produksi / editing', icon: 'clock', color: 'text-amber-600 bg-amber-50' },
              { label: 'Akan Datang', val: kpis.upcoming, sub: 'Jadwal terbit siap', icon: 'calendar', color: 'text-purple-600 bg-purple-50' },
              { label: 'Total Views', val: formatNum(kpis.views), sub: 'Penayangan video', icon: 'eye', color: 'text-sky-600 bg-sky-50' },
              { label: 'Total Reach', val: formatNum(kpis.reach), sub: 'Akun unik tercapai', icon: 'users', color: 'text-indigo-600 bg-indigo-50' },
              { label: 'Total Interaksi', val: formatNum(kpis.totalEng), sub: 'Like, komen, share, simpan', icon: 'heart', color: 'text-rose-600 bg-rose-50' },
              { label: 'Avg Engagement Rate', val: `${kpis.avgEr}%`, sub: 'Interaksi / Reach', icon: 'sparkles', color: 'text-teal-600 bg-teal-50' },
            ].map((kpi, idx) => (
              <div key={idx} className="bg-white p-4 md:p-5 rounded-2xl border border-slate-200/90 shadow-xs hover:shadow-md transition">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{kpi.label}</span>
                  <div className={`p-2 rounded-xl ${kpi.color}`}>
                    <Icon name={kpi.icon} className="w-4 h-4" />
                  </div>
                </div>
                <div className="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">{kpi.val}</div>
                <p className="text-[10px] text-slate-400 mt-1 font-medium">{kpi.sub}</p>
              </div>
            ))}
          </div>

          {/* VISUALISASI GRAFIK DISTRIBUSI & PERFORMA */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Donut Chart: Distribusi Platform */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-900">Distribusi Platform</h3>
                <p className="text-xs text-slate-400 mb-4">Porsi publikasi tiap channel</p>
              </div>
              
              <div className="flex items-center justify-center py-2">
                <div className="relative w-36 h-36 flex items-center justify-center">
                  <svg className="w-full h-full -rotate-90" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="14" fill="transparent" stroke="#f1f5f9" strokeWidth="4" />
                    <circle cx="18" cy="18" r="14" fill="transparent" stroke="#000000" strokeWidth="4" strokeDasharray={`${platformDist[0].pct} 100`} />
                    <circle cx="18" cy="18" r="14" fill="transparent" stroke="#E1306C" strokeWidth="4" strokeDasharray={`${platformDist[1].pct} 100`} strokeDashoffset={`-${platformDist[0].pct}`} />
                    <circle cx="18" cy="18" r="14" fill="transparent" stroke="#1877F2" strokeWidth="4" strokeDasharray={`${platformDist[2].pct} 100`} strokeDashoffset={`-${platformDist[0].pct + platformDist[1].pct}`} />
                  </svg>
                  <div className="absolute text-center">
                    <span className="text-lg font-bold text-slate-800">{filteredContents.length}</span>
                    <span className="block text-[9px] text-slate-400 uppercase font-semibold">Total</span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100 text-center">
                {platformDist.map(item => (
                  <div key={item.name} className="p-2 bg-slate-50 rounded-xl">
                    <p className="text-[10px] text-slate-500 font-semibold">{item.name}</p>
                    <p className="text-sm font-bold text-slate-900 mt-0.5">{item.count}</p>
                    <p className="text-[10px] text-slate-400 font-medium">{item.pct}%</p>
                  </div>
                ))}
              </div>
            </div>

            {/* Bar Chart: Views Antar Platform */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-900">Perbandingan Views</h3>
                <p className="text-xs text-slate-400 mb-4">Total views terkumpul dari postingan</p>
              </div>

              <div className="space-y-3.5 my-auto">
                {[
                  { name: 'TikTok', views: platformViews.tiktok, color: 'bg-black' },
                  { name: 'Instagram', views: platformViews.instagram, color: 'bg-gradient-to-r from-purple-500 to-pink-500' },
                  { name: 'Facebook', views: platformViews.facebook, color: 'bg-blue-600' }
                ].map(p => {
                  const max = Math.max(...Object.values(platformViews), 1);
                  const width = Math.min(100, Math.round((p.views / max) * 100));
                  return (
                    <div key={p.name} className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                      <div className="flex justify-between text-xs font-semibold mb-1.5">
                        <span className="text-slate-800">{p.name}</span>
                        <span className="text-indigo-600 font-bold">{formatNum(p.views)} Views</span>
                      </div>
                      <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                        <div className={`h-full ${p.color}`} style={{ width: `${width}%` }}></div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <p className="text-[10px] text-slate-400 text-center mt-3 pt-3 border-t border-slate-100">
                Pencatatan metrik manual via tombol "Input Metrik"
              </p>
            </div>

            {/* Top Content Rankings */}
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-slate-900">Top Postingan Terunggul</h3>
                <p className="text-xs text-slate-400 mb-4">Berdasarkan volume penayangan</p>
              </div>

              <div className="space-y-2.5 my-auto">
                {filteredContents
                  .filter(c => c.status === 'Published')
                  .slice(0, 3)
                  .map(c => {
                    let totalV = 0;
                    if (c.platformMetrics) {

              <button
                onClick={() => setCurrentDate(new Date())}
                className="text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 shadow-xs"
              >
                Hari Ini
              </button>
              <div className="flex items-center bg-white rounded-xl border border-slate-200 shadow-xs">
                <button
                  onClick={() => setCurrentDate(new Date(year, month - 1, 1))}
                  className="p-1.5 text-slate-600 hover:bg-slate-100 rounded-l-xl"
                >
                  <Icon name="chevronLeft" className="w-4 h-4" />
                </button>
                <span className="text-xs font-bold px-3 text-slate-800">
                  {monthNames[month]} {year}
                </span>
                <button
                  onClick={() => setCurrentDate(new Date(year, month + 1, 1))}
                  className="p-1.5 text-slate-600 hover:bg-slate-100 rounded-r-xl"
                >
                  <Icon name="chevronRight" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center py-2.5 text-xs font-bold text-slate-600">
              <span className="text-rose-500">Minggu</span>
              <span>Senin</span>
              <span>Selasa</span>
              <span>Rabu</span>
              <span>Kamis</span>
              <span>Jumat</span>
              <span>Sabtu</span>
            </div>

            <div className="grid grid-cols-7 divide-x divide-y divide-slate-100 min-h-[500px]">
              {Array.from({ length: firstDay }).map((_, i) => (
                <div key={`empty-${i}`} className="bg-slate-50/40 p-2"></div>
              ))}

              {Array.from({ length: totalDays }).map((_, i) => {
                const day = i + 1;
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();

                const dayContents = contents.filter(c => {
                  if (!c.scheduledAt) return false;
                  const cd = new Date(c.scheduledAt);
                  return cd.getFullYear() === year && cd.getMonth() === month && cd.getDate() === day;
                });

                return (
                  <div
                    key={day}
                    onClick={() => onDateClick(dateStr)}
                    className={`p-2 min-h-[95px] hover:bg-indigo-50/30 cursor-pointer transition flex flex-col justify-between group ${
                      isToday ? 'bg-indigo-50/20' : ''
                    }`}
                  >
                    <div className="flex justify-between items-center">
                      <span className={`text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full ${
                        isToday ? 'bg-indigo-600 text-white' : 'text-slate-700'
                      }`}>
                        {day}
                      </span>
                      <span className="text-[10px] text-slate-400 opacity-0 group-hover:opacity-100 transition">+ Rencana</span>
                    </div>

                    <div className="space-y-1 overflow-y-auto max-h-[60px] my-1">
                      {dayContents.map(c => (
                        <div
                          key={c.id}
                          onClick={(e) => {
                            e.stopPropagation();
                            onOpenDetail(c);
                          }}
                          className="text-[10px] p-1 bg-white border border-slate-200 rounded font-medium truncate flex items-center gap-1 shadow-2xs"
                        >
                          <span className={`w-1.5 h-1.5 rounded-full ${
                            c.status === 'Published' ? 'bg-emerald-500' : 'bg-indigo-500'
                          }`}></span>
                          <span className="truncate text-slate-800">{c.title}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    function AnalyticsView({ contents, onExportCSV, onPrint }) {
      const summary = React.useMemo(() => {
        let totalViews = 0, totalReach = 0, totalLikes = 0, totalComments = 0, totalShares = 0, totalSaves = 0;
        contents.forEach(c => {
          if (c.platformMetrics) {
            Object.values(c.platformMetrics).forEach(m => {
              totalViews += Number(m.views || 0);
              totalReach += Number(m.reach || 0);
              totalLikes += Number(m.likes || 0);
              totalComments += Number(m.comments || 0);
              totalShares += Number(m.shares || 0);
              totalSaves += Number(m.saves || 0);
            });
          }
        });
        const totalEng = totalLikes + totalComments + totalShares + totalSaves;
        const avgEr = calcER(totalLikes, totalComments, totalShares, totalSaves, totalReach);
        return { totalViews, totalReach, totalEng, avgEr };
      }, [contents]);

      return (
        <div className="space-y-6">

              <span className="text-xs text-slate-400 font-semibold uppercase">Engagement Rate</span>
              <p className="text-2xl font-bold text-teal-600 mt-1">{summary.avgEr}%</p>

                onChange={(e) => setTitle(e.target.value)}
                required
                className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 sm:col-span-1 focus:outline-none focus:bg-white"
              />
              <select
                value={platform}
                onChange={(e) => setPlatform(e.target.value)}
                className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
              >
                <option value="tiktok">TikTok</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
              </select>
              <select
                value={pillar}
                onChange={(e) => setPillar(e.target.value)}
                className="text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
              >
                {CONTENT_PILLARS.map(p => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <textarea
              placeholder="Catatan brief / hook gagasan..."
              value={desc}
              onChange={(e) => setDesc(e.target.value)}
              rows={2}
              className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:bg-white"
            />
            <button
              type="submit"
              className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition"
            >
              + Simpan Ide
            </button>
          </form>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {ideas.map(item => (
              <div key={item.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between space-y-3">
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <span className={`text-[9px] px-2 py-0.5 rounded font-bold uppercase ${PLATFORMS[item.platform]?.badgeClass}`}>
                      {item.platform}
                    </span>
                    <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">
                      {item.status}
                    </span>
                  </div>
                  <h4 className="font-bold text-xs text-slate-900">{item.title}</h4>
                  <p className="text-xs text-slate-500 mt-1 line-clamp-3">{item.description || 'Tidak ada catatan.'}</p>
                </div>

                <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                  <button
                    onClick={() => onConvertToPlan(item)}
                    className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-xl flex items-center gap-1 transition"
                  >
                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                    <span>Jadikan Rencana</span>
                  </button>
                  <button
                    onClick={() => {
                      setIdeas(ideas.filter(i => i.id !== item.id));
                      showToast('Ide berhasil dihapus.');
                    }}
                    className="text-slate-400 hover:text-rose-600 p-1"
                  >
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. PENGATURAN & SETUP FIREBASE COMPONENT
    // ==========================================
    function SettingsView({ showToast }) {
      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h2 className="text-xl md:text-2xl font-bold text-slate-900 tracking-tight">Pengaturan & Integrasi Firebase</h2>
            <p className="text-xs text-slate-500">Panduan konfigurasi Cloud Firestore permanen dan deployment GitHub Pages.</p>
          </div>

          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4 text-xs">
            <h3 className="font-bold text-slate-900 text-sm">Status Database Aktif</h3>
            <p className="text-slate-600">
              Saat ini data tersimpan di penyimpanan browser lokal (<b>LocalStorage</b>) sehingga aman dari batas kedaluwarsa 30 hari. 
              Untuk menghubungkan langsung ke Firebase Firestore Anda:
            </p>

            <div className="p-4 bg-slate-900 text-slate-200 rounded-xl font-mono text-[11px] overflow-x-auto space-y-2">
              <p className="text-indigo-400">// Salin aturan keamanan firestore.rules di Firebase Console:</p>
              <pre>{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
  }
}`}</pre>
            </div>

            <div className="pt-2 text-slate-500">
              <p><b>Tips:</b> Dengan aturan di atas, database Firebase Anda akan aktif permanen seumur hidup tanpa masa kedaluwarsa 30 hari karena mode testing otomatis diganti dengan aturan otentikasi UID terisolasi.</p>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODALS: FORM, DETAIL, & INPUT METRIK
    // ==========================================
    function ContentFormModal({ item, onClose, onSave }) {
      const [formData, setFormData] = React.useState({
        id: item?.id || '',
        title: item?.title || '',
        description: item?.description || '',
        platforms: item?.platforms || ['tiktok'],
        format: item?.format || 'Reels',
        contentPillar: item?.contentPillar || 'Edukasi',
        campaign: item?.campaign || '',
        targetAudiens: item?.targetAudiens || '',
        objective: item?.objective || 'Engagement',
        caption: item?.caption || '',
        hashtags: item?.hashtags || '',
        referenceUrl: item?.referenceUrl || '',
        assetUrl: item?.assetUrl || '',
        scheduledAt: item?.scheduledAt || new Date().toISOString().slice(0, 16),
        deadlineAt: item?.deadlineAt || new Date().toISOString().slice(0, 16),
        assignee: item?.assignee || 'Boby PIC',
        priority: item?.priority || 'Normal',
        status: item?.status || 'Ide',
        internalNotes: item?.internalNotes || ''
      });

      const togglePlatform = (p) => {
        if (formData.platforms.includes(p)) {
          if (formData.platforms.length === 1) return;
          setFormData({ ...formData, platforms: formData.platforms.filter(x => x !== p) });
        } else {
          setFormData({ ...formData, platforms: [...formData.platforms, p] });
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl border border-slate-100 my-8 flex flex-col max-h-[90vh]">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
              <h3 className="font-bold text-base text-slate-900">{formData.id ? 'Edit Rencana Konten' : 'Buat Rencana Baru'}</h3>
              <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-700">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="p-6 overflow-y-auto space-y-4 text-xs">
              <div>
                <label className="block font-semibold text-slate-700 mb-1">Judul Konten *</label>
                <input
                  type="text"
                  required
                  value={formData.title}
                  onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                  placeholder="Contoh: 5 Alasan Kenapa Bisnis Butuh Video Singkat"
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-slate-900 focus:outline-none focus:bg-white"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1.5">Platform Target *</label>
                <div className="flex gap-2">
                  {['tiktok', 'instagram', 'facebook'].map(p => {
                    const active = formData.platforms.includes(p);
                    return (
                      <button
                        key={p}
                        type="button"
                        onClick={() => togglePlatform(p)}
                        className={`px-3.5 py-1.5 rounded-xl border text-xs font-bold uppercase transition flex items-center gap-1 ${
                          active ? PLATFORMS[p]?.badgeClass + ' border-transparent' : 'bg-slate-50 text-slate-500 border-slate-200'
                        }`}
                      >
                        {active && <Icon name="check" className="w-3.5 h-3.5" />}
                        <span>{p}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Format</label>
                  <select
                    value={formData.format}
                    onChange={(e) => setFormData({ ...formData, format: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  >
                    {CONTENT_FORMATS.map(f => <option key={f} value={f}>{f}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Pilar Konten</label>
                  <select
                    value={formData.contentPillar}
                    onChange={(e) => setFormData({ ...formData, contentPillar: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  >
                    {CONTENT_PILLARS.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Prioritas</label>
                  <select
                    value={formData.priority}
                    onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  >
                    <option value="Rendah">Rendah</option>
                    <option value="Normal">Normal</option>
                    <option value="Tinggi">Tinggi</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Jadwal Publikasi (WIB)</label>
                  <input
                    type="datetime-local"
                    value={formData.scheduledAt}
                    onChange={(e) => setFormData({ ...formData, scheduledAt: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Deadline Produksi</label>
                  <input
                    type="datetime-local"
                    value={formData.deadlineAt}
                    onChange={(e) => setFormData({ ...formData, deadlineAt: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Draft Caption</label>
                <textarea
                  rows={2}
                  value={formData.caption}
                  onChange={(e) => setFormData({ ...formData, caption: e.target.value })}
                  placeholder="Tulis draf caption..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3"
                />
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 font-semibold text-slate-600 hover:bg-slate-100 rounded-xl border border-slate-200"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs"
                >
                  Simpan Konten
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ContentDetailModal({ item, onClose, onEdit, onInputMetric }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-xl shadow-2xl border border-slate-100 p-6 space-y-4 text-xs">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${STATUSES[item.status]?.bg}`}>
                {item.status}
              </span>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <div>
              <h3 className="text-base font-bold text-slate-900">{item.title}</h3>
              <p className="text-slate-500 mt-1">{item.description || 'Tidak ada deskripsi singkat.'}</p>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 p-3 bg-slate-50 rounded-xl text-slate-700">
              <div><span className="text-slate-400 block text-[10px]">Format:</span><b>{item.format}</b></div>
              <div><span className="text-slate-400 block text-[10px]">Pilar:</span><b>{item.contentPillar}</b></div>
              <div><span className="text-slate-400 block text-[10px]">PIC:</span><b>{item.assignee}</b></div>
              <div><span className="text-slate-400 block text-[10px]">Prioritas:</span><b>{item.priority}</b></div>
            </div>

            {item.caption && (
              <div className="space-y-1">
                <span className="font-bold text-slate-700">Caption:</span>
                <div className="p-3 bg-slate-50 rounded-xl whitespace-pre-wrap">{item.caption}</div>
              </div>
            )}

            <div className="flex justify-between items-center pt-3 border-t border-slate-100">
              {item.status === 'Published' && (
                <button onClick={onInputMetric} className="bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-xl">
                  + Catat Metrik
                </button>
              )}
              <div className="flex gap-2 ml-auto">
                <button onClick={onEdit} className="border border-slate-200 px-3 py-1.5 rounded-xl font-semibold text-slate-700">Edit</button>
                <button onClick={onClose} className="bg-slate-900 text-white px-3 py-1.5 rounded-xl font-semibold">Tutup</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function MetricModal({ item, onClose, onSave }) {
      const [platform, setPlatform] = React.useState(item.platforms[0] || 'tiktok');
      const cur = item.platformMetrics?.[platform] || {};

      const [views, setViews] = React.useState(cur.views || 0);
      const [reach, setReach] = React.useState(cur.reach || 0);
      const [likes, setLikes] = React.useState(cur.likes || 0);
      const [comments, setComments] = React.useState(cur.comments || 0);
      const [shares, setShares] = React.useState(cur.shares || 0);
      const [saves, setSaves] = React.useState(cur.saves || 0);

      const er = calcER(likes, comments, shares, saves, reach);

      const handleSubmit = (e) => {
        e.preventDefault();
        const updated = {
          ...item,
          status: 'Published',
          platformMetrics: {
            ...(item.platformMetrics || {}),
            [platform]: {
              views: Number(views),
              reach: Number(reach),
              likes: Number(likes),
              comments: Number(comments),
              shares: Number(shares),
              saves: Number(saves),
              updatedAt: new Date().toISOString()
            }
          }
        };
        onSave(updated);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl border border-slate-100 p-6 space-y-4 text-xs">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <h3 className="font-bold text-sm text-slate-900">Catat Metrik: {item.title}</h3>
              <button onClick={onClose}><Icon name="close" className="w-5 h-5 text-slate-400" /></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div className="flex gap-2">
                {item.platforms.map(p => (
                  <button
                    key={p}
                    type="button"
                    onClick={() => {
                      setPlatform(p);
                      const m = item.platformMetrics?.[p] || {};
                      setViews(m.views || 0);
                      setReach(m.reach || 0);
                      setLikes(m.likes || 0);
                      setComments(m.comments || 0);
                      setShares(m.shares || 0);
                      setSaves(m.saves || 0);
                    }}
                    className={`px-3 py-1 rounded-xl text-xs font-bold uppercase ${
                      platform === p ? PLATFORMS[p]?.badgeClass : 'bg-slate-100 text-slate-600'
                    }`}
                  >
                    {p}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Views</label>
                  <input type="number" min="0" value={views} onChange={e => setViews(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Reach</label>
                  <input type="number" min="0" value={reach} onChange={e => setReach(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Likes</label>
                  <input type="number" min="0" value={likes} onChange={e => setLikes(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Comments</label>
                  <input type="number" min="0" value={comments} onChange={e => setComments(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Shares</label>
                  <input type="number" min="0" value={shares} onChange={e => setShares(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
                <div>
                  <label className="block text-slate-600 font-semibold mb-1">Saves</label>
                  <input type="number" min="0" value={saves} onChange={e => setSaves(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2" />
                </div>
              </div>

              <div className="p-3 bg-indigo-50 border border-indigo-100 rounded-xl flex justify-between items-center">
                <span className="font-semibold text-indigo-900">Engagement Rate:</span>
                <span className="font-bold text-indigo-600 text-sm">{er}%</span>
              </div>

              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 border border-slate-200 rounded-xl">Batal</button>
                <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold">Simpan Metrik</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render App ke Root Element
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
