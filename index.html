<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialFlow Planner & Analytics Dashboard (V2.4.2)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel untuk membaca JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase App & Firestore SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INISIALISASI FIREBASE (V2.4.2) ---
    const firebaseConfig = {
      apiKey: "AIzaSyCEJGbd7A3SqqzvyiY1aP9sqeeHKnzyfqI",
      authDomain: "socialflow-planner-analytics.firebaseapp.com",
      projectId: "socialflow-planner-analytics",
      storageBucket: "socialflow-planner-analytics.firebasestorage.app",
      messagingSenderId: "41368071647",
      appId: "1:41368071647:web:878b7ada81d622cb64286a"
    };

    let firestoreDb = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      firestoreDb = firebase.firestore();
    } catch (err) {
      console.warn("Firestore fallback:", err);
    }

    // --- KONSTANTA PLATFORM & STATUS ---
    const PLATFORMS = {
      TIKTOK: { name: 'TikTok', bg: 'bg-black text-white', border: 'border-black' },
      INSTAGRAM: { name: 'Instagram', bg: 'bg-gradient-to-r from-purple-500 to-pink-500 text-white', border: 'border-pink-500' },
      FACEBOOK: { name: 'Facebook', bg: 'bg-blue-600 text-white', border: 'border-blue-600' }
    };

    const STATUS_LIST = ['Ide', 'Brief', 'Produksi', 'Editing', 'Siap Posting', 'Terjadwal', 'Published', 'Cancelled'];
    const PILLARS = ['Edukasi', 'Hiburan', 'Promosi', 'Testimoni', 'Behind the Scenes', 'Tips & Trik', 'Inspirasi'];
    const FORMATS = ['Reels', 'TikTok Video', 'Story', 'Carousel', 'Foto', 'Facebook Video', 'Live'];

    // --- DATA AWAL (DEFAULT) ---
    const INITIAL_CONTENTS = [
      {
        id: "demo-1",
        title: "5 Tips Optimasi Reels & Algoritma 2026",
        platform: "Instagram",
        format: "Carousel",
        pillar: "Edukasi",
        status: "Published",
        scheduledDate: "2026-10-27",
        scheduledTime: "19:00",
        caption: "Mau jangkauan akunmu naik 300%? Terapkan pola hook 3 detik ini! 🚀 #tipsreels #marketing",
        hashtags: "#tipsreels #marketing #contentstrategy",
        referenceUrl: "https://instagram.com",
        assetUrl: "https://drive.google.com",
        views: 18400,
        reach: 14200,
        likes: 1120,
        comments: 84,
        shares: 145,
        saves: 430
      },
      {
        id: "demo-2",
        title: "POV: Kerja di Agensi pas Hari Jumat Sore",
        platform: "TikTok",
        format: "TikTok Video",
        pillar: "Hiburan",
        status: "Published",
        scheduledDate: "2026-10-26",
        scheduledTime: "17:00",
        caption: "Ketika revisi masuk pas jam 16.59... Siapa yang pernah ngalamin? 😂 #agencylife",
        hashtags: "#agencylife #funny #creator",
        referenceUrl: "https://tiktok.com",
        assetUrl: "",
        views: 65200,
        reach: 49000,
        likes: 5800,
        comments: 420,
        shares: 1250,
        saves: 310
      },
      {
        id: "demo-3",
        title: "Promo Flash Sale Payday Akhir Bulan",
        platform: "Facebook",
        format: "Carousel",
        pillar: "Promosi",
        status: "Siap Posting",
        scheduledDate: "2026-10-29",
        scheduledTime: "12:00",
        caption: "Promo gajian diskon 40% cuma 3 hari! Cek katalog sekarang.",
        hashtags: "#promopayday #diskon",
        referenceUrl: "",
        assetUrl: "https://drive.google.com",
        views: 0,
        reach: 0,
        likes: 0,
        comments: 0,
        shares: 0,
        saves: 0
      }
    ];

    const INITIAL_IDEAS = [
      {
        id: "idea-1",
        title: "Kamera HP 2 Jutaan vs iPhone untuk Bikin Konten",
        platform: "TikTok",
        pillar: "Edukasi",
        status: "Disetujui",
        description: "Blind test perbandingan hasil video tanpa edit untuk mengedukasi pemula.",
        referenceUrl: "https://tiktok.com/@contoh/video/1",
        assetUrl: "https://drive.google.com/drive/folders/materi-hp"
      },
      {
        id: "idea-2",
        title: "Mitos Shadowban Instagram 2026 yang Masih Dipercaya",
        platform: "Instagram",
        pillar: "Edukasi",
        status: "Dipertimbangkan",
        description: "Bongkar mitos pembatasan akun berdasarkan klarifikasi resmi Meta.",
        referenceUrl: "https://instagram.com/p/referensi",
        assetUrl: ""
      }
    ];

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [deviceMode, setDeviceMode] = useState('web');
      const [calendarViewMode, setCalendarViewMode] = useState('spreadsheet'); // 'spreadsheet', 'grid', 'list'
      const [toast, setToast] = useState(null);

      // --- JAM REALTIME (WIB - ASIA/JAKARTA) ---
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTime(new Date());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const formattedClock = useMemo(() => {
        return currentTime.toLocaleTimeString('id-ID', {
          timeZone: 'Asia/Jakarta',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }, [currentTime]);

      const formattedDateHeader = useMemo(() => {
        return currentTime.toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      }, [currentTime]);

      // --- DATA KONTEN & IDE ---
      const [contents, setContents] = useState(() => {
        const saved = localStorage.getItem('sf_contents');
        return saved ? JSON.parse(saved) : INITIAL_CONTENTS;
      });

      const [ideas, setIdeas] = useState(() => {
        const saved = localStorage.getItem('sf_ideas');
        return saved ? JSON.parse(saved) : INITIAL_IDEAS;
      });

      // Filter & Search
      const [searchQuery, setSearchQuery] = useState('');
      const [filterPlatform, setFilterPlatform] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');

      // Modals
      const [showContentModal, setShowContentModal] = useState(false);
      const [editingContent, setEditingContent] = useState(null);

      // Form Konten
      const [formData, setFormData] = useState({
        title: '',
        platform: 'Instagram',
        format: 'Reels',
        pillar: 'Edukasi',
        status: 'Ide',
        scheduledDate: new Date().toISOString().split('T')[0],
        scheduledTime: '18:00',
        caption: '',
        hashtags: '',
        referenceUrl: '',
        assetUrl: '',
        views: 0,
        reach: 0,
        likes: 0,
        comments: 0,
        shares: 0,
        saves: 0
      });

      // Form Ide Spontan
      const [ideaForm, setIdeaForm] = useState({
        title: '',
        platform: 'TikTok',
        pillar: 'Edukasi',
        description: '',
        referenceUrl: '',
        assetUrl: ''
      });

      const showToastMessage = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Simpan LocalStorage & Sync Firestore
      useEffect(() => {
        localStorage.setItem('sf_contents', JSON.stringify(contents));
      }, [contents]);

      useEffect(() => {
        localStorage.setItem('sf_ideas', JSON.stringify(ideas));
      }, [ideas]);

      useEffect(() => {
        if (!firestoreDb) return;
        const unsubscribe = firestoreDb.collection("contents").onSnapshot((snapshot) => {
          if (!snapshot.empty) {
            const remoteData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setContents(remoteData);
          }
        }, (err) => console.warn("Firestore sync:", err));
        return () => unsubscribe();
      }, []);

      // CRUD HANDLERS
      const handleSaveContent = async (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const payload = {
          ...formData,
          views: Number(formData.views) || 0,
          reach: Number(formData.reach) || 0,
          likes: Number(formData.likes) || 0,
          comments: Number(formData.comments) || 0,
          shares: Number(formData.shares) || 0,
          saves: Number(formData.saves) || 0,
          updatedAt: new Date().toISOString()
        };

        if (editingContent) {
          const targetId = editingContent.id;
          setContents(prev => prev.map(c => c.id === targetId ? { ...payload, id: targetId } : c));
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(String(targetId)).set(payload, { merge: true }); } catch (err) {}
          }
          showToastMessage("Konten berhasil diperbarui!");
        } else {
          const newId = "cnt-" + Date.now();
          const toAdd = { ...payload, id: newId, createdAt: new Date().toISOString() };
          setContents(prev => [toAdd, ...prev]);
          if (firestoreDb) {
            try { await firestoreDb.collection("contents").doc(newId).set(toAdd); } catch (err) {}
          }
          showToastMessage("Rencana konten baru berhasil dibuat!");
        }
        setShowContentModal(false);
        setEditingContent(null);
      };

      const handleDeleteContent = async (id) => {
        if (!confirm("Hapus jadwal konten ini?")) return;
        setContents(prev => prev.filter(c => c.id !== id));
        if (firestoreDb) {
          try { await firestoreDb.collection("contents").doc(String(id)).delete(); } catch (err) {}
        }
        showToastMessage("Konten berhasil dihapus.");
      };

      const handleDuplicateContent = (item) => {
        const dupId = "cnt-" + Date.now();
        const dup = { ...item, id: dupId, title: item.title + " (Duplikat)", status: "Ide" };
        setContents(prev => [dup, ...prev]);
        if (firestoreDb) {
          try { firestoreDb.collection("contents").doc(dupId).set(dup); } catch (err) {}
        }
        showToastMessage("Konten diduplikasi ke Bank Ide!");
      };

      // IDE HANDLERS
      const handleSaveIdea = (e) => {
        e.preventDefault();
        if (!ideaForm.title.trim()) return;
        const newIdea = { ...ideaForm, id: "idea-" + Date.now(), status: "Dipertimbangkan" };
        setIdeas([newIdea, ...ideas]);
        setIdeaForm({ title: '', platform: 'TikTok', pillar: 'Edukasi', description: '', referenceUrl: '', assetUrl: '' });
        showToastMessage("Ide tersimpan di Bank Ide!");
      };

      const handlePromoteIdea = (idea) => {
        setEditingContent(null);
        setFormData({
          title: idea.title,
          platform: idea.platform,
          format: 'Reels',
          pillar: idea.pillar,
          status: 'Brief',
          scheduledDate: new Date().toISOString().split('T')[0],
          scheduledTime: '18:00',
          caption: idea.description || '',
          hashtags: '',
          referenceUrl: idea.referenceUrl || '',
          assetUrl: idea.assetUrl || '',
          views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
        });
        setShowContentModal(true);
      };

      const handleDeleteIdea = (id) => {
        setIdeas(prev => prev.filter(i => i.id !== id));
        showToastMessage("Ide dihapus.");
      };

      // METRIK SUMMARY
      const metrics = useMemo(() => {
        const total = contents.length;
        const published = contents.filter(c => c.status === 'Published').length;
        const inProgress = contents.filter(c => ['Brief', 'Produksi', 'Editing', 'Siap Posting'].includes(c.status)).length;
        const scheduled = contents.filter(c => c.status === 'Terjadwal').length;

        const totalViews = contents.reduce((acc, c) => acc + (Number(c.views) || 0), 0);
        const totalReach = contents.reduce((acc, c) => acc + (Number(c.reach) || 0), 0);
        const totalEngagement = contents.reduce((acc, c) => acc + (Number(c.likes)||0) + (Number(c.comments)||0) + (Number(c.shares)||0) + (Number(c.saves)||0), 0);
        const avgER = totalReach > 0 ? ((totalEngagement / totalReach) * 100).toFixed(2) : "0.00";

        return { total, published, inProgress, scheduled, totalViews, totalReach, totalEngagement, avgER };
      }, [contents]);

      const filteredContents = useMemo(() => {
        return contents.filter(c => {
          const matchSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (c.caption && c.caption.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchPlatform = filterPlatform === 'ALL' || c.platform === filterPlatform;
          const matchStatus = filterStatus === 'ALL' || c.status === filterStatus;
          return matchSearch && matchPlatform && matchStatus;
        });
      }, [contents, searchQuery, filterPlatform, filterStatus]);

      // Ekspor CSV
      const handleExportCSV = () => {
        const headers = ["ID", "Judul", "Platform", "Format", "Pillar", "Status", "Tanggal", "Jam", "Views", "Reach", "Likes", "Comments", "Shares", "Saves", "Referensi", "Aset"];
        const rows = contents.map(c => [
          c.id, `"${c.title.replace(/"/g, '""')}"`, c.platform, c.format, c.pillar, c.status,
          c.scheduledDate, c.scheduledTime, c.views, c.reach, c.likes, c.comments, c.shares, c.saves,
          `"${c.referenceUrl || ''}"`, `"${c.assetUrl || ''}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `SocialFlow_Planner_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToastMessage("Data CSV berhasil didownload!");
      };

      return (
        <div className={`min-h-screen ${deviceMode === 'hp' ? 'bg-slate-800 p-2 sm:p-6 flex justify-center items-start' : 'bg-slate-50'}`}>
          
          <div className={`w-full transition-all duration-300 flex flex-col ${
            deviceMode === 'hp' 
              ? 'max-w-md bg-white min-h-[844px] rounded-[36px] shadow-2xl border-4 border-slate-700 overflow-hidden relative' 
              : 'min-h-screen lg:flex-row flex'
          }`}>

            {/* SIDEBAR (Desktop Web Mode) */}
            {deviceMode === 'web' && (
              <aside className="w-64 bg-slate-900 text-slate-100 flex-shrink-0 flex flex-col justify-between p-5 border-r border-slate-800">
                <div>
                  <div className="flex items-center gap-3 mb-8">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-indigo-500/30">
                      S
                    </div>
                    <div>
                      <h1 className="font-extrabold text-base tracking-tight leading-none text-white">SocialFlow</h1>
                      <div className="flex items-center gap-1.5 mt-1.5">
                        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                          V2.4.2
                        </span>
                      </div>
                    </div>
                  </div>

                  <nav className="space-y-1.5 text-sm font-semibold">
                    {[
                      { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                      { id: 'planner', label: 'Content Planner', icon: '📝' },
                      { id: 'calendar', label: 'Kalender Konten', icon: '📅' },
                      { id: 'database', label: 'Database Master', icon: '🗄️' },
                      { id: 'analytics', label: 'Rekap & Laporan', icon: '📈' },
                      { id: 'ideas', label: 'Bank Ide Konten', icon: '💡' },
                      { id: 'settings', label: 'Pengaturan & Cloud', icon: '⚙️' }
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition-all ${
                          currentTab === item.id 
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                            : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                        }`}
                      >
                        <span className="text-base">{item.icon}</span>
                        {item.label}
                      </button>
                    ))}
                  </nav>
                </div>

                {/* JAM REALTIME WIB & STATUS FIREBASE */}
                <div className="pt-4 border-t border-slate-800/80 text-xs text-slate-400 space-y-2.5">
                  <div className="bg-slate-800/70 p-3 rounded-xl border border-slate-700/60">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-slate-400 block">Waktu Real-time</span>
                    <div className="flex items-baseline gap-1.5 mt-0.5">
                      <span className="text-lg font-black text-white font-mono">{formattedClock}</span>
                      <span className="text-[10px] font-bold text-indigo-400">WIB</span>
                    </div>
                    <p className="text-[11px] text-slate-400 mt-1 truncate">{formattedDateHeader}</p>
                  </div>

                  <div className="flex items-center gap-2 px-1">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50 animate-pulse"></span>
                    <span className="font-semibold text-slate-300 text-xs">Cloud Firestore Connected</span>
                  </div>
                </div>
              </aside>
            )}

            {/* MAIN AREA */}
            <main className="flex-1 flex flex-col h-full overflow-y-auto custom-scrollbar pb-20 lg:pb-6">
              
              {/* TOP HEADER */}
              <header className="bg-white/80 backdrop-blur sticky top-0 z-30 px-5 py-3.5 border-b border-slate-200/80 flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  {deviceMode === 'hp' && (
                    <span className="w-8 h-8 rounded-xl bg-indigo-600 text-white font-black text-sm flex items-center justify-center">S</span>
                  )}
                  <div>
                    <h2 className="font-extrabold text-slate-900 text-lg leading-tight capitalize">
                      {currentTab === 'ideas' ? 'Bank Ide Konten' : currentTab === 'calendar' ? 'Kalender & Spreadsheet' : currentTab}
                    </h2>
                    <p className="text-xs text-slate-500 hidden sm:block">Perencanaan & Analisis Konten Multi-Platform</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <div className="bg-slate-100 p-1 rounded-xl flex items-center gap-1 border border-slate-200 text-xs font-semibold">
                    <button
                      onClick={() => setDeviceMode('hp')}
                      className={`px-2.5 py-1 rounded-lg transition ${deviceMode === 'hp' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}
                    >
                      📱 HP
                    </button>
                    <button
                      onClick={() => setDeviceMode('web')}
                      className={`px-2.5 py-1 rounded-lg transition ${deviceMode === 'web' ? 'bg-white shadow text-indigo-600' : 'text-slate-500'}`}
                    >
                      💻 Web
                    </button>
                  </div>

                  <button
                    onClick={() => {
                      setEditingContent(null);
                      setFormData({
                        title: '', platform: 'Instagram', format: 'Reels', pillar: 'Edukasi', status: 'Ide',
                        scheduledDate: new Date().toISOString().split('T')[0], scheduledTime: '18:00',
                        caption: '', hashtags: '', referenceUrl: '', assetUrl: '',
                        views: 0, reach: 0, likes: 0, comments: 0, shares: 0, saves: 0
                      });
                      setShowContentModal(true);
                    }}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow-md shadow-indigo-500/20 transition flex items-center gap-1.5"
                  >
                    <span>+</span> Rencana Konten
                  </button>
                </div>
              </header>

              {/* TOAST NOTIFIKASI */}
              {toast && (
                <div className="fixed top-16 right-6 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 border border-slate-700">
                  <span className="text-emerald-400">✓</span> {toast}
                </div>
              )}

              {/* ROUTING TAB VIEW */}
              <div className="p-4 sm:p-6 space-y-6">

                {/* TAB 1: DASHBOARD */}
                {currentTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                      <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Konten</span>
                        <p className="text-2xl font-black text-slate-900 mt-1">{metrics.total}</p>
                        <p className="text-[11px] text-indigo-600 font-semibold mt-1">Direncanakan & Tayang</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Sudah Publish</span>
                        <p className="text-2xl font-black text-emerald-600 mt-1">{metrics.published}</p>
                        <p className="text-[11px] text-slate-500 mt-1">Live di feed / shorts</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Sedang Produksi</span>
                        <p className="text-2xl font-black text-amber-600 mt-1">{metrics.inProgress}</p>
                        <p className="text-[11px] text-slate-500 mt-1">Brief & editing</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Terjadwal</span>
                        <p className="text-2xl font-black text-blue-600 mt-1">{metrics.scheduled}</p>
                        <p className="text-[11px] text-slate-500 mt-1">Siap posting</p>
                      </div>

                      <div className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm">
                        <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Total Tayangan</span>
                        <p className="text-2xl font-black text-slate-900 mt-1">{metrics.totalViews.toLocaleString('id-ID')}</p>
                        <p className="text-[11px] text-purple-600 font-semibold mt-1">Akumulasi views</p>

                            placeholder="📁 Link file / aset materi (Google Drive / Cloud)..."
                            value={ideaForm.assetUrl}
                            onChange={(e) => setIdeaForm({ ...ideaForm, assetUrl: e.target.value })}
                            className="border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                          />
                        </div>

                        <textarea
                          rows="2"
                          placeholder="Catatan brief / hook gagasan / poin penting konten..."
                          value={ideaForm.description}
                          onChange={(e) => setIdeaForm({ ...ideaForm, description: e.target.value })}
                          className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                        ></textarea>

                        <button
                          type="submit"
                          className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md shadow-indigo-600/20 transition"
                        >
                          + Simpan Ide
                        </button>
                      </form>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {ideas.map(item => (
                        <div key={item.id} className="bg-white p-4 rounded-2xl border border-slate-200/90 shadow-sm flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between gap-2 mb-2">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${PLATFORMS[item.platform.toUpperCase()]?.bg || 'bg-slate-900 text-white'}`}>
                                {item.platform}
                              </span>
                              <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-700">
                                {item.status}
                              </span>
                            </div>
                            <h3 className="font-extrabold text-sm text-slate-900 mb-1">{item.title}</h3>
                            <p className="text-xs text-slate-500 mb-3">{item.description || 'Tidak ada catatan detail.'}</p>

                            <div className="flex flex-wrap gap-2 mb-3 text-[10px]">
                              {item.referenceUrl && (
                                <a href={item.referenceUrl} target="_blank" rel="noreferrer" className="text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md font-semibold hover:underline">
                                  🔗 Lihat Referensi
                                </a>
                              )}
                              {item.assetUrl && (
                                <a href={item.assetUrl} target="_blank" rel="noreferrer" className="text-emerald-700 bg-emerald-50 px-2 py-1 rounded-md font-semibold hover:underline">
                                  📁 Buka Aset Materi
                                </a>
                              )}
                            </div>
                          </div>

                          <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <button
                              onClick={() => handlePromoteIdea(item)}
                              className="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5"
                            >
                              <span>✨</span> Jadikan Rencana
                            </button>
                            <button
                              onClick={() => handleDeleteIdea(item.id)}
                              className="text-slate-400 hover:text-rose-600 p-1.5 transition"
                              title="Hapus Ide"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 7: PENGATURAN */}
                {currentTab === 'settings' && (
                  <div className="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-sm space-y-4">
                    <div>
                      <h3 className="font-extrabold text-slate-900 text-base">Status Integrasi Cloud Firebase (V2.4.2)</h3>
                      <p className="text-xs text-slate-500">Database Firestore Anda aktif permanen seumur hidup tanpa batas kedaluwarsa.</p>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-900 text-slate-100 font-mono text-xs overflow-x-auto space-y-1">
                      <p className="text-slate-400">// Project Firebase Terhubung:</p>
                      <p>Project ID: <span className="text-emerald-400">socialflow-planner-analytics</span></p>
                      <p>Auth Domain: <span className="text-indigo-300">socialflow-planner-analytics.firebaseapp.com</span></p>
                      <p>Database: <span className="text-emerald-400">Cloud Firestore (Active)</span></p>
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        onClick={() => {
                          if (confirm("Reset ulang data ke contoh awal?")) {
                            setContents(INITIAL_CONTENTS);
                            setIdeas(INITIAL_IDEAS);
                            showToastMessage("Data demo berhasil dimuat ulang!");
                          }
                        }}
                        className="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl hover:bg-slate-200"
                      >
                        Muat Data Demo Awal
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </main>

            {/* BOTTOM NAV BAR (Mode Smartphone) */}
            <div className={`lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-slate-200 px-3 py-2 flex justify-around items-center z-40 ${deviceMode === 'hp' ? 'absolute rounded-b-[32px]' : ''}`}>
              {[
                { id: 'dashboard', label: 'Home', icon: '📊' },
                { id: 'planner', label: 'Planner', icon: '📝' },
                { id: 'calendar', label: 'Kalender', icon: '📅' },
                { id: 'ideas', label: 'Ide', icon: '💡' },
                { id: 'database', label: 'Data', icon: '🗄️' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setCurrentTab(item.id)}
                  className={`flex flex-col items-center py-1 px-2 rounded-lg text-[10px] font-bold ${
                    currentTab === item.id ? 'text-indigo-600' : 'text-slate-400'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  {item.label}
                </button>
              ))}
            </div>

          </div>

          {/* MODAL FORM KONTEN */}
          {showContentModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl my-8 border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-extrabold text-slate-900">
                    {editingContent ? 'Edit Konten' : 'Tambah Rencana Konten'}
                  </h3>
                  <button onClick={() => setShowContentModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
                </div>

                <form onSubmit={handleSaveContent} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Judul Konten / Hook</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: 3 Tips Outfit Minimalis 2026"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Platform</label>
                      <select
                        value={formData.platform}
                        onChange={(e) => setFormData({ ...formData, platform: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-white"
                      >
                        <option value="Instagram">Instagram</option>
                        <option value="TikTok">TikTok</option>
                        <option value="Facebook">Facebook</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Format</label>
                      <select
                        value={formData.format}
                        onChange={(e) => setFormData({ ...formData, format: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-white"
                      >
                        {FORMATS.map(f => <option key={f} value={f}>{f}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Pillar Konten</label>
                      <select
                        value={formData.pillar}
                        onChange={(e) => setFormData({ ...formData, pillar: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-white"
                      >
                        {PILLARS.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Status Produksi</label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs bg-white"
                      >
                        {STATUS_LIST.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jadwal Tanggal</label>
                      <input
                        type="date"
                        value={formData.scheduledDate}
                        onChange={(e) => setFormData({ ...formData, scheduledDate: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Jam Posting (WIB)</label>
                      <input
                        type="time"
                        value={formData.scheduledTime}
                        onChange={(e) => setFormData({ ...formData, scheduledTime: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Link Referensi</label>
                      <input
                        type="url"
                        placeholder="https://..."
                        value={formData.referenceUrl}
                        onChange={(e) => setFormData({ ...formData, referenceUrl: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Link File / Aset</label>
                      <input
                        type="url"
                        placeholder="Google Drive link..."
                        value={formData.assetUrl}
                        onChange={(e) => setFormData({ ...formData, assetUrl: e.target.value })}
                        className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Caption</label>
                    <textarea
                      rows="2"
                      placeholder="Tulis caption dan call-to-action..."
                      value={formData.caption}
                      onChange={(e) => setFormData({ ...formData, caption: e.target.value })}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs"
                    ></textarea>
                  </div>

                  {formData.status === 'Published' && (
                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                      <span className="font-bold text-slate-800 text-[11px] block">Pencatatan Metrik Performa:</span>
                      <div className="grid grid-cols-3 gap-2">
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Views</label>
                          <input
                            type="number"
                            value={formData.views}
                            onChange={(e) => setFormData({ ...formData, views: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Reach</label>
                          <input
                            type="number"
                            value={formData.reach}
                            onChange={(e) => setFormData({ ...formData, reach: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-500 font-semibold">Likes</label>
                          <input
                            type="number"
                            value={formData.likes}
                            onChange={(e) => setFormData({ ...formData, likes: e.target.value })}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1 text-xs"
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowContentModal(false)}
                      className="px-4 py-2 border border-slate-200 rounded-xl text-slate-600 font-semibold hover:bg-slate-50"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md shadow-indigo-600/30 hover:bg-indigo-700"
                    >
                      Simpan Konten
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
